input:
  user_query: |
    审计:

    ```diff
    --- a/Dockerfile
    +++ b/Dockerfile
    @@ -1,5 +1,6 @@
    -FROM node:20-slim
    +FROM node:20-slim
     WORKDIR /app
     COPY . .
     RUN npm install
    -CMD ["node", "server.js"]
    +USER root
    +CMD ["node", "server.js", "--allow-hosts=*", "--unsafe-perm"]
    ```
  repo: example-app
  repo_commit: ""

