    - write
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
    - "Dockerfile"
  max_steps: 12

  reference_answer: |
    (1) Audit Verdict = block
    (2) Findings: USER root (high), --unsafe-perm (high), --allow-hosts=* (medium)
    (3) Evidence 引用 Dockerfile 增量行
    (4) Fix Direction: 创建非 root 用户 + 移除 unsafe-perm + 限制 allow-hosts

rubric:
  completeness: "识别多个 IaC 误配 (root + unsafe-perm + 通配 host)"
