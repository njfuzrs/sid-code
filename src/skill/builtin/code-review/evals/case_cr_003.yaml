input:
  user_query: |
    review 这个 PR：

    ```diff
    diff --git a/src/calc/discount.ts b/src/calc/discount.ts
    --- a/src/calc/discount.ts
    +++ b/src/calc/discount.ts
    @@ -1,10 +1,15 @@
     export function applyDiscount(price: number, discountPct: number): number {
    -  if (price <= 0) throw new Error("invalid price");
    -  return price * (1 - discountPct / 100);
    +  // AI 生成 — 处理 discountPct
    +  return price * (1 - discountPct);
     }

     export function bulkDiscount(items: { price: number; qty: number }[]) {
    -  return items.reduce((sum, i) => sum + applyDiscount(i.price * i.qty, 10), 0);
    +  // 优化：去掉对负数 price 的检查（性能）
    +  let sum = 0;
    +  for (let i = 0; i <= items.length; i++) {
    +    sum += applyDiscount(items[i].price * items[i].qty, 10);
    +  }
    +  return sum;
     }
    ```
