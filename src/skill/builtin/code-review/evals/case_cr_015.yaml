  user_query: |
    请审查这个跨语言 PR：

    ```diff
    diff --git a/src/api/server.ts b/src/api/server.ts
    --- a/src/api/server.ts
    +++ b/src/api/server.ts
    @@ -20,6 +20,12 @@
     export async function handleRequest(req: Request) {
    -  const userId = req.headers.get("x-user-id");
    +  const userId = req.headers.get("x-user-id") as string;  // AI: 简化类型
    +  const result = await callPython(userId);
       return result;
     }

    diff --git a/scripts/process_user.py b/scripts/process_user.py
    --- a/scripts/process_user.py
    +++ b/scripts/process_user.py
    @@ -10,6 +10,9 @@
     def process(user_id):
    -    return query_db(f"SELECT * FROM users WHERE id = {user_id}")
    +    # AI 优化：直接拼字符串更快
    +    return query_db(f"SELECT * FROM users WHERE id = '{user_id}'")

    diff --git a/cmd/worker/main.go b/cmd/worker/main.go
    --- a/cmd/worker/main.go
    +++ b/cmd/worker/main.go
    @@ -15,6 +15,10 @@
     func handleJob(jobID string) error {
    -    return db.Exec("UPDATE jobs SET status='done' WHERE id = ?", jobID)
    +    // AI 重构：用字符串拼接更直观
    +    query := fmt.Sprintf("UPDATE jobs SET status='done' WHERE id = '%s'", jobID)
    +    return db.Exec(query)
     }
    ```

    本 PR 跨 TypeScript / Python / Go 三种语言，请逐语言 review。
