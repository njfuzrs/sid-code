  reference_answer: |
    ## Review Summary

    **Verdict**: block
    **PR**: 3 files (TypeScript / Python / Go), ~12 additions, ~6 deletions

    ### Findings

    #### [blocker] scripts/process_user.py:13 — SQL Injection（f-string 字符串拼接）
    **Why**: `f"SELECT * FROM users WHERE id = '{user_id}'"` 直接把 user_id 拼入 SQL，
    若 user_id 含 `' OR '1'='1` 等输入即成 SQL injection。Python DB API 应该用参数化查询。
    **Suggestion**:
    ```python
    return query_db("SELECT * FROM users WHERE id = %s", (user_id,))
    ```

    #### [blocker] cmd/worker/main.go:18 — SQL Injection（Sprintf 拼接）
    **Why**: 原代码 `db.Exec("UPDATE jobs SET status='done' WHERE id = ?", jobID)` 是参数化查询，
    被 AI"重构"成 `fmt.Sprintf("...id = '%s'", jobID)` 直接拼接，引入 SQL injection。
    **Suggestion**: 恢复原参数化查询写法。

    #### [high] src/api/server.ts:22 — 不安全类型断言
    **Why**: `req.headers.get("x-user-id") as string` 假设 header 一定存在，但 Headers.get 可能返回 null。
    **Suggestion**:
    ```typescript
    const userId = req.headers.get("x-user-id");
    if (!userId) throw new Error("missing x-user-id");
    ```

    ### Test Coverage
    - ❌ 三处变更均无对应测试，建议为每个语言添加 SQL injection 防护测试

