  reference_answer: |
    必须三个失败都识别 + 给优先级:
    优先级 1 (build_failure, Go): undefined: stripeClient — 阻塞编译,先修
    优先级 2 (type_error, TS): src/ui/login.tsx:15 类型不匹配 — 阻塞 build
    优先级 3 (test_failure, Python): test_login 500 — 业务逻辑 bug,但不阻塞 build
    建议先按"阻塞性"修,test_failure 留到最后

