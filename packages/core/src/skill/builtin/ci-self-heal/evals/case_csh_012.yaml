input:
  user_query: |
    单 repo 多语言项目 CI 挂了, 同时 Python + Go + TypeScript 都报错:

    ```
    [python] tests/test_api.py::test_login FAILED
        AssertionError: expected 200, got 500
        File "tests/test_api.py", line 28
    [go] FAIL ./internal/payment [build failed]
        ./internal/payment/charge.go:42:14: undefined: stripeClient
    [typescript] tsc src/ui/login.tsx
        src/ui/login.tsx(15,7): error TS2322: Type 'string' is not assignable to type 'number'.
    ```

    哪一个最严重? 给我诊断.
