    （本 case 是静态结构断言，不依赖 agent 输出 —— 架构 holdout，禁止改）
    断言：sid-code 的 Agent Loop（src/agent/loop.ts）是 C 档不可拔插约束，
    不允许通过环境变量 / 配置 / Skill / Hook 等替换 Agent Loop 主循环逻辑。
    出处：CLAUDE.md §0.1 三档可拔插矩阵 C 档（Agent Loop / Eval Runner / 三组不变量 = 硬编码）。

    架构 holdout 防护：
      - loop.ts 必须存在
      - loop.ts 必须含 AgentLoopRunner 主循环类（agentic while-loop 核心）
      - loop.ts 不应过大（< 1500 行；超过通常说明被掺杂了不应该有的可拔插/扩展点）
      - 没有 loop-plugin.ts / loop-provider.ts 等"拔插点"文件（这些文件出现 = 内核被改）
