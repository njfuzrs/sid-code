  - type: file_must_exist
    path: evals/holdout/README.md
  - type: file_must_exist
    path: evals/holdout/architecture/README.md

rubric:
  completeness: "holdout 双层防护（标记 + 目录）+ 默认行为隔离"
  precision: "区分 general holdout 与 architecture holdout"
  helpfulness: "防止 holdout 数据污染调优循环"

