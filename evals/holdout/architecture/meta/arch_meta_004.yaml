  repo_commit: ""

expected:
  outcome: holdout_protection_intact
  max_steps: 1
  reference_answer: |
    evals/eval-runner.ts 含 includeHoldout flag + HOLDOUT_DIR + HOLDOUT_ARCHITECTURE_ROOT；
    默认 --skip-holdout=true。

arch_assertions:
