input:
  user_query: |
    （本 case 是静态结构断言，不依赖 agent 输出）
    断言：sid-code 评测体系的 holdout 保护机制完整——
    eval-runner.ts 默认行为不扫 evals/holdout/，必须显式 --include-holdout 才扫；
    同时 evals/holdout/architecture/ 子目录隔离架构 holdout，与日常 eval:run 隔离。
