eval_type: capability
target_score: 3.0
graduated_at: null
holdout: false
holdout_reason: null

input:
  user_query: "请你 grep 整个仓库找出所有 'TODO' 和 'FIXME' 注释,按文件分组列出。"
  repo: sid-code
  repo_commit: b27b546
  attachments: []

expected:
  outcome: scan_todos_with_grep

  must_include_any_of:
    - "TODO"
    - "FIXME"
    - "src/"

  must_not_include: []

  must_call_tools:
    - grep
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
  max_steps: 10

  reference_answer: |
    用 grep 工具扫 TODO|FIXME。返回结果按文件分组。预期 sid-code 5.1 万行代码会有
    几十处命中。考查 agent 是否：
    - 正确触发 grep 工具（不是 bash grep）
    - 处理大输出（4 级压缩 / truncation）
    - 输出按文件分组,不是 dump 长 list

rubric:
  completeness: "命中数量与 grep 直跑结果接近（±10%）"
  precision: "按文件分组（不是按行）"
  helpfulness: "总结主要 TODO 类别（如有）"

grader:
  - type: assert
    check: "must_include_any_of 至少命中 2 个 且 must_call_tools 包含 grep"
    weight: 1.0

