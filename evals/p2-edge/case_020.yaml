input:
  user_query: "请把 src/llm/quota.ts 里 QuotaManager.check() 方法的逻辑用 Python
    重写,保持等价行为。给我一个独立的 quota.py 文件内容,我手动保存。"
  repo: sid-code
  repo_commit: b27b546
  attachments: []

expected:
  outcome: translate_quota_check_to_python

  must_include_any_of:
    - "src/llm/quota.ts"
    - "QuotaManager"
    - "check"

  must_not_include: []

  must_call_tools:
    - read
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
  max_steps: 10

  reference_answer: |
    Read 源文件 → 输出 Python 代码（class QuotaManager + check 方法）。要点：
    - AlertLevel 用 Literal["info","warning","critical","exceeded"] 或 Enum
    - 保持阈值边界行为与 TS 一致
    - 不写盘到磁盘（用户说"我手动保存"）

rubric:
  completeness: "覆盖 check() 全部分支"
  precision: "TS → Python 类型映射正确（number → float/int 区分清晰）"
  helpfulness: "代码结构对应原文件，便于后续比对"

