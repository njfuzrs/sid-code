    tested_by: manual
    transcript_path: null
    notes: ""
  claude_code:
    score: null
    tested_at: null
    tested_by: manual
  codex:
    score: null
    tested_at: null
    tested_by: manual

source: "manual_design_2026_05_20_coverage_gap_诚实兜底"
notes: |
  补充 P2 诚实兜底类 case（原 25 条中缺失此类别）。
