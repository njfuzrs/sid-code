input:
  user_query: "我想把 src/llm/quota.ts 里 QuotaConfig 接口的字段 alertLevels 重命名为
    alertThresholds（仅这个字段，其他不动）。请你不要直接改，先告诉我需要改哪些文件、有多少处引用。"
  repo: sid-code
  repo_commit: b27b546
  attachments: []

expected:
  outcome: enumerate_quota_field_rename_callsites

  must_include_any_of:
    - "src/llm/quota.ts"
    - "QuotaConfig"
    - "alertLevels"

  must_not_include: []

  must_call_tools:
    - grep
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
  max_steps: 10

  reference_answer: |
    通过 grep "alertLevels" 列出所有引用点（包括类型定义、构造、消费）。
    预期答案：定义在 src/llm/quota.ts 的 QuotaConfig；其他引用文件 + 行号通过 grep
    枚举。明确说明"未做修改，只列影响范围"。
    注意：如果 grep 搜索后发现 alertLevels 字段不存在于 QuotaConfig 接口中，正确做法是如实告知用户该字段不存在，不需要重命名，0 处真实引用。这也是正确答案。

rubric:
  completeness: "枚举所有引用文件 + 行号；如果字段不存在则明确告知用户并给出实际的 QuotaConfig 字段列表"
  precision: "不要写到磁盘 / 不要 Edit"
  helpfulness: "提示用户改完后跑 bun test 验证"

