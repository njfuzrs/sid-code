input:
  user_query: "帮我追踪 MemoryStore 的完整调用链：从 src/cli.ts 入口到 src/app.ts 再到
    src/memory/store.ts，列出每个文件中 MemoryStore 被 import 和实例化的具体行号，以及数据流向（哪里读、哪里写）"
  repo: sid-code
  repo_commit: 764e7b9

expected:
  outcome: trace_memory_store_call_chain
  must_include_any_of:
    - "src/cli.ts"
    - "src/app.ts"
    - "src/memory/store.ts"
    - "MemoryStore"
    - "import"
  must_not_include: []
  must_call_tools:
    - grep
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files: []
  max_steps: 18
  reference_answer: |
    调用链：
    1. src/cli.ts:381 — import MemoryStore，实例化 new MemoryStore(process.cwd())
    2. src/app.ts:308,412,690 — 三处 import + 实例化，分别用于初始化加载、CLAUDE.md 写入、运行时读写
    3. src/memory/store.ts:45 — MemoryStore 类定义，管理 globalDir + projectDir 两层存储
    数据流向：cli.ts 初始化读 → app.ts 运行时读写 → store.ts 持久化到 ~/.sid-code/memory/ 和 .sid-code/memory/

rubric:
  completeness: "是否列出了 cli.ts 和 app.ts 中所有 MemoryStore 的使用点"
  precision: "行号是否准确（允许 ±5 行误差）"
  helpfulness: "是否清晰描述了数据流向（读/写方向）"

grader:
  - type: assert
    check: "must_include_any_of 至少命中 4 个"
    weight: 0.5
  - type: assert
    check: "must_call_tools 命中 grep"
    weight: 0.5

