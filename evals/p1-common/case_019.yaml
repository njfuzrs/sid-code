input:
  user_query: "如果某个 MCP server 启动失败（比如配置错误 / 进程启动超时），sid-code 的 MCPManager
    会怎么处理?是会让整个 sid-code 启动失败,还是降级继续?请定位错误处理代码。"
  repo: sid-code
  repo_commit: b27b546
  attachments: []

expected:
  outcome: locate_mcp_failure_handling

  must_include_any_of:
    - "src/mcp/manager.ts"
    - "MCPManager"
    - "MCPServerStatusInfo"

  must_not_include: []

  must_call_tools:
    - grep
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
  max_steps: 12

  reference_answer: |
    定位 MCPManager 中的连接失败处理（try/catch、status 字段更新）。期望答案：
    - 给出错误处理具体行号
    - 明确"是否阻塞 sid-code 启动"的结论
    - 引用 MCPServerStatusInfo 字段（第 22 行）说明状态如何被记录

rubric:
  completeness: "结论 + 行号 + 状态字段"
  precision: "结论必须是从源码读出来的(不是猜测)"
  helpfulness: "如有死锁/资源泄漏隐患,指出"

grader:
  - type: assert
    check: "must_include_any_of 至少命中 2 个"
    weight: 1.0

