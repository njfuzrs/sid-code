input:
  user_query: "sid-code 的 MCP（Model Context Protocol）客户端实现在哪里?MCPManager 类是如何把外部
    MCP server 提供的工具适配成 sid-code 的内置 Tool 接口的?"
  repo: sid-code
  repo_commit: b27b546
  attachments: []

expected:
  outcome: explain_mcp_tool_adaptation

  must_include_any_of:
    - "src/mcp/manager.ts"
    - "MCPManager"
    - "MCPToolAdapter"
    - "implements Tool"

  must_not_include: []

  must_call_tools:
    - read
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
  max_steps: 12

  reference_answer: |
    src/mcp/manager.ts:
    - MCPToolAdapter（第 50 行,implements Tool）：把 MCP server 工具包装成 sid-code 的
      Tool 接口
    - MCPManager（第 110 行）：管理多个 MCP client 连接 + 工具注册
    适配流程：MCPManager 启动 → 连 MCP server → listTools() → 每个 MCP 工具 new
    MCPToolAdapter → 注册到 ToolRegistry。运行时调用回流 tool_input → MCP client →
    返回 tool_result。

rubric:
  completeness: "MCPToolAdapter + MCPManager 两层都解释"
  precision: "适配方向正确（MCP → Tool,不是反过来）"
  helpfulness: "解释为什么要 Adapter 模式"

grader:
  - type: assert
    check: "must_include_any_of 至少命中 2 个"
    weight: 1.0

