    run_status: success
    tested_at: 2026-05-27T15:40:14.953Z
    tested_by: eval:plan-capability
    transcript_path: null
    notes: ""
    dimensions:
      assert: 2.9
      llm_judge: null
    _formula_version:
      grader: capability-plan-v1
