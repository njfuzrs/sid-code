# plan_005 — plan_execution_fidelity 维度：plan 与实际执行的对应度（简单任务）
# 测假设：plan 写完后，actual 工具调用序列与 plan 步骤的对应率 ≥ 70%

id: plan_005
subsystem: plan
dimension: plan_execution_fidelity
priority: P0

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

input:
  user_query: |
    src/cli.ts 的 `--version` 输出现在写死是 "0.0.1"。请改成从 package.json 读 version 字段。
    要求：不引入新依赖；写一个单测验证。
  trigger_plan_mode: true

expected:
  plan_min_steps: 3
  plan_max_steps: 6
  plan_must_cover_any_of:
    - "读 package.json"
    - "改 cli.ts"
    - "写测试"
    - "跑测试"
  plan_must_not_have:
    - "npm install"
    - "bun add"
  execution_must_call_tools_any_of: [ read, edit, write, bash, exit_plan_mode ]
  max_steps: 20

  # fidelity 维度专属：实际执行 step 数与 plan 步骤的 ratio 应接近 1
  fidelity_step_ratio_min: 0.5
  fidelity_step_ratio_max: 2.5

rubric:
  fidelity_actual_vs_plan: "actual 工具调用序列是否对应 plan 步骤"
  fidelity_no_off_plan: "是否有 plan 没提及的额外步骤"
  fidelity_step_count: "actual 步数应接近 plan 步数（ratio 0.5-2.5）"

grader:
  - type: assert
    check: plan_min_steps
    weight: 0.15
  - type: assert
    check: plan_max_steps
    weight: 0.10
  - type: assert
    check: fidelity_step_ratio_in_range
    weight: 0.30
  - type: assert
    check: execution_must_call_tools_any_of_hit
    weight: 0.10
  - type: llm_judge
    weight: 0.35
    rubric_ref:
      - fidelity_actual_vs_plan
      - fidelity_no_off_plan
      - fidelity_step_count

source: synthetic_capability_2026_05_18_W10
related_subsystem: [ plan ]
related_adr: [ ADR-013 ]
