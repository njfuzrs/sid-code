# plan_003 — plan_generation 维度：架构设计任务（无现有代码参照）
# 测假设：sid-code 能在"全新模块设计"场景下输出合理多步 plan

id: plan_003
subsystem: plan
dimension: plan_generation
priority: P0

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

input:
  user_query: |
    sid-code 当前没有"会话回放"功能。请设计并实现：用户输入 `/replay <session_id>`，
    sid-code 把该 session 的所有消息+工具调用按时间顺序在 TUI 中重放出来，
    支持暂停/继续/单步前进。
    要求：复用现有 src/session/store.ts 的持久化；UI 走 src/ui/。
  trigger_plan_mode: true

expected:
  plan_min_steps: 6
  plan_max_steps: 15
  # S0-T10 加同义词组：agent 用 "SessionStore/SessionData/ReplayState" 等真实代码标识
  # hit 阈值 ≥4（原 hit_ge_5 偏严,与 plan_001/002 不一致,降到 ≥4）
  plan_must_cover_any_of:
    # 节点 1：读 session/store
    - "读 session/store"
    - "session/store"
    - "SessionStore"
    - "session.load"
    - "SessionData"
    # 节点 2：session 数据结构
    - "session 数据结构"
    - "ReplayState"
    - "数据结构"
    - "Message[]"
    # 节点 3：Replay 状态机
    - "Replay 状态机"
    - "状态机"
    - "PlaybackSpeed"
    - "isPlaying"
    - "currentIndex"
    # 节点 4：TUI 组件
    - "TUI 组件"
    - "ReplayDialog"
    - "DialogType"
    - "HistoryItemDisplay"
    # 节点 5：暂停/继续/单步
    - "暂停/继续"
    - "暂停"
    - "继续"
    - "单步"
    - "前进"
    # 节点 6：斜杠命令
    - "斜杠命令"
    - "/replay"
    - "command"
    - "register"
    # 节点 7：单测
    - "单测"
    - "tests/"
    - "bun test"
  plan_must_not_have:
    - "改 LLM provider"
    - "改 trajectory-platform"
  execution_must_call_tools_any_of: [ read, write, edit, exit_plan_mode ]
  max_steps: 60

rubric:
  plan_completeness: "plan 是否覆盖数据/状态机/UI/命令/测试 5 个层面"
  plan_step_independence: "每步是否独立可验证"
  plan_step_ordering: "顺序是否合理（应该先设计数据/状态，再做 UI）"

grader:
  - type: assert
    check: plan_min_steps
    weight: 0.20
  - type: assert
    check: plan_must_cover_any_of_hit_ge_4
    weight: 0.25
  - type: assert
    check: plan_must_not_have_zero_match
    weight: 0.10
  - type: assert
    check: execution_must_call_tools_any_of_hit
    weight: 0.10
  - type: llm_judge
    weight: 0.35
    rubric_ref:
      - plan_completeness
      - plan_step_independence
      - plan_step_ordering

source: synthetic_capability_2026_05_18_W10
related_subsystem: [ plan ]
related_adr: [ ADR-013, ADR-022 ]
known_limitation:
  type: case_design + llm_capability_gap
  reason: "S0-T10 加同义词组 + hit_ge_5→ge_4 后 N=3 中位仍 3.1 < GA；agent 真正缺的关键节点是 session 数据结构 / Replay 状态机 / 斜杠命令注册——这是 deepseek-v4-pro 对 sid-code TUI 架构(DialogType/HistoryItemDisplay)不熟悉,改 case 无法解决"
  resolved_in: "S1 模型横评(横评 claude/opus 等熟悉 TUI 架构的模型) 或 S2 拆条/收窄到单一节点维度"
