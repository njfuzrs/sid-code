# plan_009 — plan_premature_exit 维度：简单 1 步任务下不该过度规划
# 测假设：1-2 步可解的任务，plan 步骤数应 ≤ 3（反向断言，防止"什么都过度 plan"）

id: plan_009
subsystem: plan
dimension: plan_premature_exit
priority: P0

eval_type: capability
target_score: 4.0
# 2026-05-29: 撤销毕业（A2-3 / F-1）—— 原 4 个锚点中 "改 cli.ts"/"typo" 复读 user_query，
# agent 复读 query 即可命中阈值。重写锚点后需重新跑 N=3 中位数验证毕业（待 A3-4 重跑）。
graduated_at: null
holdout: false
_audit_note: |
  graduated under flawed anchors (echo bias).
  原 plan_must_cover_any_of: [改 cli.ts, Edit, typo] —— 其中 "改 cli.ts" / "typo" 直接复读
  user_query（含 src/cli.ts + recevied typo），agent 仅复读 query 即满足 ≥ 1/3 命中阈值。
  详见 docs/eval/investigations/case-design-audit.md §2.2 H-1 同型。
  重写后须 A3-4 N=3 重跑验证锚点鉴别力，再决定是否重新毕业。

input:
  user_query: |
    src/cli.ts 第 20 行有个 typo："recevied" 应为 "received"。请改了。
  trigger_plan_mode: true

expected:
  plan_min_steps: 1
  plan_max_steps: 3
  # 锚点设计：避开 user_query 已点名的 cli.ts / typo / recevied / received，
  # 改用 plan 步骤里"工具名"+"步数克制"的真实信号——agent 必须在 plan 中明确
  # 使用 Edit/edit_string/replace 等编辑动作描述，而不只是复述用户给的位置。
  plan_must_cover_any_of:
    - "Edit"
    - "edit_string"
    - "replace"
    - "old_string"
    - "new_string"
  plan_must_not_have:
    - "新增测试"
    - "全仓 grep"
    - "重构"
    - "更新 CHANGELOG"
    - "运行 lint"
    - "Read 整个文件"
  execution_must_call_tools_any_of: [ edit, exit_plan_mode ]
  max_steps: 8

  # premature_exit 维度核心断言
  premature_exit_max_plan_steps: 3

rubric:
  premature_exit_concise: "plan 是否克制（≤ 3 步），不为简单 typo 写 5+ 步流程"
  premature_exit_no_scope_creep: "是否避免 hallucinate 出额外需求（新增测试 / 全仓 typo 排查 / 重构）"
  premature_exit_direct_action: "plan 是否直接指向 Edit 操作而非 'understand → analyze → fix'"

grader:
  - type: assert
    check: premature_exit_max_plan_steps
    weight: 0.40
  - type: assert
    check: plan_must_not_have_zero_match
    weight: 0.20
  - type: assert
    check: execution_must_call_tools_any_of_hit
    weight: 0.10
  - type: llm_judge
    weight: 0.30
    rubric_ref:
      - premature_exit_concise
      - premature_exit_no_scope_creep
      - premature_exit_direct_action

source: synthetic_capability_2026_05_18_W10
related_subsystem: [ plan ]
related_adr: [ ADR-013 ]
