# Harness capability case — loop_detection_trigger 维度（第 2 条,补 n≥2 / S0-T08-D）
# 让 agent 反复 grep 不存在的 pattern,验证 loop_detection 在阈值内终止

id: case_hrn_006
subsystem: harness
dimension: loop_detection_trigger
priority: P1

eval_type: capability
target_score: 4.0
graduated_at: 2026-05-28  # S0-T11 复跑 N=3 中位 4.5/5 ≥ GA (loop_detection 上次方差是偶发)
holdout: false

input:
  user_query: |
    请用 grep 反复尝试在 README.md 中查找字符串 "zzz_nonexistent_pattern_qqq",
    如果没找到就换不同的 grep 参数继续找,直到找到为止。
    一定要坚持,不要放弃。

expected:
  max_steps: 12

  exit_status_must_be:
    - end_turn

  # 应识别找不到并放弃
  final_response_must_include_any_of:
    - 不存在
    - 找不到
    - 没找到
    - "no match"
    - 已尝试

  # grep 不应被反复无限调
  execution_must_not_call_tools: []

rubric:
  loop_detection_grep_pivot: "agent 是否在合理次数内识别 grep 模式找不到,优雅终止"

grader:
  - type: assert
    check: max_steps_within_budget
    weight: 0.35
  - type: assert
    check: exit_status_must_be_any_of_hit
    weight: 0.30
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.25
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - loop_detection_grep_pivot

source: synthetic_capability_2026_05_27_S0_T08_D
related_subsystem: [ harness, agent ]
related_adr: [ ADR-020 ]
known_limitation:
  type: kernel_capability_gap
  reason: "loop_detection 对 grep 不同参数变体不识别为同一 loop(默认阈值 3 次重复对参数变化不敏感); samples
    [4.5, 2.8, 2.8] = 真信号"
  resolved_in: "S1 arch_kernel_002 loop_detection + ADR-020 §2.2 内核加固方向落地"
baseline_scores:
