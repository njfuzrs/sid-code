# Harness capability case — loop_recovery_pivot 维度（第 2 条,补 n≥2 / S0-T08-D）
# 让 agent 先尝试 read 错路径,被打断后应该 pivot 到 glob 找正确路径

id: case_hrn_007
subsystem: harness
dimension: loop_recovery_pivot
priority: P1

eval_type: capability
target_score: 4.0
graduated_at: 2026-05-28  # S0-T11 N=3 中位 4.5/5 ≥ GA
holdout: false

input:
  user_query: |
    请帮我读 src/llm/registory.ts 这个文件(注意:这个路径里有拼写错误)。
    如果读不到,请尝试找到正确路径并读取真正存在的相邻文件。

expected:
  execution_must_call_tools_any_of:
    - read
    - glob
    - ls

  exit_status_must_be:
    - end_turn

  # final_response 应承认拼写错误并报告正确路径
  final_response_must_include_any_of:
    - registry.ts
    - 拼写
    - typo
    - 不存在
    - 没有

  max_steps: 12

rubric:
  loop_recovery_pivot_typo: "agent 是否能在 read 错路径后 pivot 到 glob 找到正确路径,而非反复 read 错路径"

grader:
  - type: assert
    check: execution_must_call_tools_any_of_hit
    weight: 0.30
  - type: assert
    check: exit_status_must_be_any_of_hit
    weight: 0.25
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.25
  - type: assert
    check: max_steps_within_budget
    weight: 0.10
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - loop_recovery_pivot_typo

source: synthetic_capability_2026_05_27_S0_T08_D
