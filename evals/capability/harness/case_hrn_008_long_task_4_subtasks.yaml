# Harness capability case — harness_long_task_completion 维度（第 2 条,补 n≥2 / S0-T08-D）
# 让 agent 完成 5 步工具组合任务,验证长任务不中断

id: case_hrn_008
subsystem: harness
dimension: harness_long_task_completion
priority: P1

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

input:
  user_query: |
    请按顺序完成以下 4 个小任务,每个都用 1-2 步工具完成:
    1. 列出当前仓库根目录的顶层条目数量。
    2. 在 evals/capability/router/ 下有几个 case yaml?
    3. src/llm/ 目录下有多少个 .ts 文件?
    4. 整理上述三个数字,做一个简短总结。

expected:
  execution_must_call_tools_any_of:
    - bash
    - glob
    - ls
    - grep

  exit_status_must_be:
    - end_turn

  # 应给出三个数字 / 计数
  final_response_must_include_any_of:
    - "数"
    - "个"
    - "总"
    - "条"

  max_steps: 20

rubric:
  long_task_4step_completion: "4 步任务是否全部覆盖,不漏步骤"

grader:
  - type: assert
    check: execution_must_call_tools_any_of_hit
    weight: 0.25
  - type: assert
    check: exit_status_must_be_any_of_hit
    weight: 0.25
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.20
  - type: assert
    check: max_steps_within_budget
    weight: 0.20
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - long_task_4step_completion

