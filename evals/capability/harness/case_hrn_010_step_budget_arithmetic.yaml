# Harness capability case — harness_step_budget 维度（第 2 条,补 n≥2 / S0-T08-D）
# 极简任务,验证 step 预算控制在合理范围(不会因为简单问题反复折腾)

id: case_hrn_010
subsystem: harness
dimension: harness_step_budget
priority: P1

eval_type: capability
target_score: 4.0
graduated_at: 2026-05-28  # S0-T11 N=3 中位 4.5/5 ≥ GA
holdout: false

input:
  user_query: |
    1 + 1 等于几?直接回答,不需要任何工具调用。

expected:
  # 不应调任何工具
  execution_must_not_call_tools:
    - read
    - bash
    - glob
    - grep
    - write
    - edit

  exit_status_must_be:
    - end_turn

  # 应给出 2（避免单字 "2"/"二"——任何带数字回答都易误命中；要求"等于"加 2）
  final_response_must_include_any_of:
    - "等于 2"
    - "= 2"
    - "是 2"
    - "结果为 2"
    - "答案是 2"
    - "等于二"

  final_response_must_not_include:
    - "我不会"
    - "请你自己算"
    - "无法回答"

  max_steps: 2

  final_response_max_length: 200

rubric:
  step_budget_minimal: "极简问题是否只用 1 步直接回答,不调任何工具"

grader:
  - type: assert
    check: execution_must_not_call_tools_zero_hit
    weight: 0.30
  - type: assert
    check: exit_status_must_be_any_of_hit
    weight: 0.20
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.20
  - type: assert
    check: max_steps_within_budget
    weight: 0.20
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - step_budget_minimal

source: synthetic_capability_2026_05_27_S0_T08_D
