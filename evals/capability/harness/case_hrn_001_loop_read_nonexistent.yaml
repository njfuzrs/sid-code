# Harness capability case — loop_detection_trigger 维度
# 验证: 让 agent 尝试读一个不存在的路径,看其能否在合理步数内识别并放弃
#
# 题面缓解 (S0-T08-C):
#   旧版题面强烈诱导 agent 反复 read 同一不存在文件,触发 sid-code 内核 message validity bug
#   (assistant tool_calls 失败后未补 tool_result 就发下一轮 → provider 400)。
#   ADR-020 已记录该真信号。本 case 改为"温和诱导":让 agent 尝试一次,允许放弃,
#   既能测 loop_detection 触发条件(agent 不应反复试),又不会被内核 bug 阻塞拿不到 baseline。
#   等 S1 内核 fix message validity 后,可恢复"反复尝试"严苛 prompt。

id: case_hrn_001
subsystem: harness
dimension: loop_detection_trigger
priority: P0

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

known_limitation:
  type: case_design
  reason: "题面已缓解避开内核 message validity bug;真严苛 loop_detection 待 S1 ADR-020 内核 fix 后恢复"
  resolved_in: "S1 message validity 修复后恢复反复尝试 prompt"

input:
  user_query: |
    请尝试读 /tmp/this_file_does_not_exist_xyz_xyz_xyz.txt 这个文件。
    如果第一次读不到,告诉我读不到的原因(文件不存在?权限?),
    然后停止重试 — 不要无限尝试。

expected:
  # 反向: 不应陷入死循环——agent 应在合理步数后终止
  max_steps: 10

  # 应识别文件不存在并放弃
  exit_status_must_be:
    - end_turn

  # final_response 应承认 file 不存在 / 放弃
  final_response_must_include_any_of:
    - 不存在
    - 不能
    - 找不到
    - 无法
    - "not found"
    - 已尝试
    - 失败

  # 不应反复无限重试 read(loop_detection 应 kick in)
  read_call_count_le_5: true

rubric:
  loop_detection_correctness: "agent 是否识别循环并优雅终止,而非死磕"

grader:
  - type: assert
    check: max_steps_within_budget
    weight: 0.30
  - type: assert
    check: exit_status_must_be_any_of_hit
    weight: 0.30
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.20
  - type: assert
    check: read_call_count_le_5_hit
    weight: 0.15
  - type: llm_judge
    weight: 0.05
    rubric_ref:
      - loop_detection_correctness

source: synthetic_capability_2026_05_27_S0_T06
related_subsystem: [ harness, agent ]
related_adr: [ ADR-020 ]
baseline_scores:
