# Router capability case — quota_alert_visible 维度
# 跑较长任务,无 quota 限制时应正常完成,不应误报 quota 警告
#
# Known Limitation (evals/a.md 问题 5):
#   本 case 没有注入 quota 限制场景,只验证"正常长任务不误报 quota"。
#   真测 quota 行为需 S2/S3 mock provider 阶段：
#     - 注入 quota 阈值 → 验证 agent 能否感知并报告
#     - 注入 quota 耗尽 → 验证 agent 是否优雅降级
#   当前 case 等价于"能否正常回答 TypeScript 问题"，与 router quota 无强关联。

id: case_rtr_004
subsystem: router
dimension: quota_alert_visible
priority: P1

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

known_limitation:
  type: case_design
  reason: "未注入 quota 限制,实测的是正常长回答能力,与 router quota 无强关联"
  resolved_in: "S2/S3 mock provider 阶段注入 quota 阈值/耗尽验证"

input:
  user_query: |
    给我详细介绍 TypeScript 的 5 个高级类型特性,每个特性给出代码示例。
    输出大约 1000 字即可。

expected:
  # 应正常完成
  exit_status_must_be:
    - end_turn

  # final_response 应含 TypeScript 类型特性的关键词
  final_response_must_include_any_of:
    - typescript
    - TypeScript
    - 泛型
    - generic
    - 联合类型
    - "union"
    - 类型守卫
    - "type guard"
    - 条件类型
    - "conditional"
    - 映射类型
    - "mapped"

  # 不应误报 quota 警告
  final_response_must_not_include:
    - "quota exceeded"
    - "超出配额"
    - "rate limit"
    - "限流"

  max_steps: 15

rubric:
  quota_alert_no_false_positive: "正常长任务不应误触发 quota 警告"

grader:
  - type: assert
    check: exit_status_must_be_any_of_hit
    weight: 0.30
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.30
  - type: assert
    check: final_response_must_not_include_zero_hit
    weight: 0.30
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - quota_alert_no_false_positive

source: synthetic_capability_2026_05_27_S0_T05
related_subsystem: [ router, llm ]
related_adr: []
baseline_scores:
