# Router capability case — provider_registration 维度
# 验证: 询问 agent 系统当前支持的 LLM provider,应能正确列出 ≥ 3 家
#
# Known Limitation (evals/a.md 问题 5):
#   本 case 仅测 agent 能否在仓库中定位 provider 注册位置并报出 ≥ 3 家厂商,
#   不能验证"router 子系统"真实行为(provider 接口契约 / 注册分发机制 / 拔插策略)。
#   真测注册机制需 S2/S3 阶段引入 mock provider:
#     - 注入第 4 个 mock provider,验证 register/lookup 流程
#     - 删除一个 provider,验证 fallback / 降级逻辑
#   当前 0.20-0.40 权重不应被解读为"router 已 ≥ GA"。

id: case_rtr_001
subsystem: router
dimension: provider_registration
priority: P0

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

# 真测补充 (2026-05-31 / ADR-021 §4.4 / S6-T06):
#   rtr_009~013 通过 MockProvider + ProviderRegistry 真测了:
#     - 注册分发 fail-fast (rtr_013 未知 provider 抛错)
#     - 缓存语义 (rtr_011 同名 getProvider 返回同实例, requestCount 跨调用累加)
#     - mock-* 路由优先级 (mock-anything 走 MockProvider, 不走 anthropic 严格枚举)
#   本 case 保留, 测的是"agent 自检报告 provider 列表"维度, known_limitation 已移除.

related_real_tests: [tests/llm/router-mock-integration.test.ts, tests/llm/registry.test.ts]

input:
  user_query: |
    sid-code 这个 CLI 当前接入了哪几家大模型厂商?给我列出具体的厂商名字。
    请基于代码事实回答,不要凭印象猜测。

expected:
  # 应调 ls / glob / read 等工具确认
  execution_must_call_tools_any_of:
    - ls
    - glob
    - read
    - bash
    - grep

  # final_response 应同时提到 anthropic / openai / ollama 三家(代码标识豁免 echo)
  final_response_must_include_any_of:
    - anthropic
    - Anthropic
    - openai
    - OpenAI
    - ollama
    - Ollama

  # 应给出"三家"或具体数字
  final_response_must_include_count_keywords_min_3:
    - anthropic
    - openai
    - ollama

  max_steps: 15

rubric:
  provider_registration_completeness: "是否完整列出 anthropic / openai / ollama 三家,不遗漏"

grader:
  - type: assert
    check: execution_must_call_tools_any_of_hit
    weight: 0.25
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.25
  - type: assert
    check: final_response_must_include_count_keywords_min_3_hit
    weight: 0.40
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - provider_registration_completeness

source: synthetic_capability_2026_05_27_S0_T05
related_subsystem: [ router, llm ]
related_adr: [ ADR-021 ]
