# Router capability case — quota_alert_visible 维度（第 2 条,补 n≥2 / S0-T08-D)
# 短任务正常完成,不应误报 quota / rate limit

id: case_rtr_008
subsystem: router
dimension: quota_alert_visible
priority: P1

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

known_limitation:
  type: case_design
  reason: "未注入 quota 限制,实测的是正常短任务能力,与 router quota 警告无强关联"
  resolved_in: "S2/S3 mock quota 阈值 — 见 ADR-021"

input:
  user_query: |
    简短一句话告诉我:Node.js 和 Bun 各自最大的差异点是什么?

expected:
  exit_status_must_be:
    - end_turn

  final_response_must_include_any_of:
    - Bun
    - bun
    - Node
    - node

  # 不应误报 quota / rate limit
  final_response_must_not_include:
    - "quota exceeded"
    - "超出配额"
    - "rate limit"
    - "限流"

  max_steps: 5

  final_response_max_length: 600

rubric:
  quota_no_false_positive_short_task: "短任务不应触发 quota 警告"

grader:
  - type: assert
    check: exit_status_must_be_any_of_hit
    weight: 0.30
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.20
  - type: assert
    check: final_response_must_not_include_zero_hit
    weight: 0.30
  - type: assert
    check: max_steps_within_budget
    weight: 0.10
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - quota_no_false_positive_short_task

