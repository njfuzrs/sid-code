# Router capability case — fallback_message_continuity 维度
# 跑普通任务,确认 retry 不影响对话连续性
#
# Known Limitation (evals/a.md 问题 5):
#   本 case 没有注入 fallback 场景（如 provider 503 / 超时 / 限流），
#   只验证"正常路径下不会误暴露 retry/fallback 内部信号"。
#   真测 fallback 连续性需 S2/S3 mock provider 阶段：
#     - 注入 provider 503 → 验证 retry 后对话无断裂
#     - 注入 rate limit → 验证 fallback 到备选 provider 后 final_response 无噪声
#   当前 case 等价于"bash echo 能正常完成"，门槛极低。

id: case_rtr_003
subsystem: router
dimension: fallback_message_continuity
priority: P0

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

known_limitation:
  type: case_design
  reason: "未注入 provider 故障,实测的是正常路径 bash 执行,与 fallback 无关"
  resolved_in: "S2/S3 mock provider 阶段注入 503/rate-limit 验证 retry 连续性"

input:
  user_query: |
    用 bash 跑 `echo "hello world"`,告诉我输出。

expected:
  execution_must_call_tools_any_of:
    - bash

  # 应 end_turn(不应有 retry/fallback 触发的中断信号)
  exit_status_must_be:
    - end_turn

  # final_response 应有 "hello world" 输出
  final_response_must_include_any_of:
    - "hello world"
    - "hello"

  # 不应在 final_response 中暴露 retry/fallback 内部信号
  final_response_must_not_include:
    - "retry failed"
    - "fallback"
    - "会话已断"
    - "无法继续"
    - "Provider error"
    - "model unavailable"

  max_steps: 5

rubric:
  fallback_no_user_facing_noise: "即使内部 retry,也不应在用户可见输出中暴露内部错误"

grader:
  - type: assert
    check: execution_must_call_tools_any_of_hit
    weight: 0.20
  - type: assert
    check: exit_status_must_be_any_of_hit
    weight: 0.30
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.20
  - type: assert
    check: final_response_must_not_include_zero_hit
    weight: 0.20
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - fallback_no_user_facing_noise

source: synthetic_capability_2026_05_27_S0_T05
related_subsystem: [ router, llm ]
related_adr: []
baseline_scores:
