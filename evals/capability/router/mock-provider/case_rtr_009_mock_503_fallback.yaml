# Router capability case rtr_009 — provider 503 fallback 真测
#
# 真测目标:
#   注入 mock-503 作为主 provider, 验证 fallback 链能切到备选 (mock-ok),
#   主流程不中断且最终响应可用. 替代 rtr_001~005 的"间接能力"测试.
#
# 注: 本 case 走集成测试模式 (不调真 LLM, 用 mock provider 真 spawn 内核 fallback 路径).
#     评分通过 tests/llm/router-mock-integration.test.ts 验证, 不进 capability eval N=3 跑分.

id: case_rtr_009
subsystem: router
dimension: provider_503_fallback
priority: P0

eval_type: integration_test
target_score: 5.0
graduated_at: null
holdout: false

related_adr: [ADR-021]
test_file: tests/llm/router-mock-integration.test.ts
test_describe: "rtr_009 — mock-503 触发 RetryableError"

input:
  scenario: |
    主 provider 配置为 mock-503 (failPattern=503, failAfterRequests=0).
    第 1 次调用应抛 RetryableError(reason=overloaded), retry/fallback 责任在调用方 (ProviderFallbackWrapper).
  mock_environment:
    primary_provider:
      name: mock-503
      fail_pattern: 503
      fail_after_requests: 0

expected:
  on_first_call: throws_retryable_error
  retryable_reason: overloaded
  request_count_after_fail: 1

rubric:
  contract: "MockProvider 503 模式必须抛 RetryableError(overloaded), 不能静默失败 / 不能抛非 Retryable 类型"

source: ADR-021_§4.4_S6_T06_2026_05_31
notes: |
  本 case 不接 sid-code-live spawn (避免 spawn-in-test 复杂度).
  S7+ dogfood 阶段如需真 spawn 验证 sid-code 主进程降级行为, 用 sid-code-live adapter 跑 + 接 ProviderRegistry mock-* 名.
