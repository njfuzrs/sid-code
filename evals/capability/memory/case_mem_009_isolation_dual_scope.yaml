# Memory capability case — memory_isolation 维度（第 2 条,补 n≥2 / S0-T08-D）
# 跨 scope 写入：让 agent 同时记住一条 global + 一条 project,验证 scope 分隔正确

id: case_mem_009
subsystem: memory
dimension: memory_isolation
priority: P1

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

input:
  user_query: |
    我有两件事请你记住:
    1. 我所有项目都偏好用 prettier 格式化 — 这是全局偏好。
    2. 这个项目用 bun 作为运行时 — 这是当前项目专属。

    请把这两条信息分别保存到对应的 memory scope。

expected:
  execution_must_call_tools_any_of:
    - memory_save
    - memory

  # 跑后应同时有 global 和 project 两类新条目
  memory_write_keys_any_of:
    - prettier
    - format
    - bun
    - runtime

  memory_write_values_any_of:
    - prettier
    - bun

  max_steps: 10

rubric:
  memory_isolation_correct_scope: "agent 是否把全局偏好写到 global,项目偏好写到 project,不混淆"

grader:
  - type: assert
    check: execution_must_call_tools_any_of_hit
    weight: 0.30
  - type: assert
    check: memory_write_keys_any_of_hit
    weight: 0.30
  - type: assert
    check: memory_write_values_any_of_hit
    weight: 0.20
  - type: assert
    check: max_steps_within_budget
    weight: 0.10
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - memory_isolation_correct_scope

