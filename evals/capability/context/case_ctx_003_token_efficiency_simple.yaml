# Context capability case — token_efficiency 维度
# 简单任务: 一步可解,不应跑 10+ 步工具

id: case_ctx_003
subsystem: context
dimension: token_efficiency
priority: P0

eval_type: capability
target_score: 4.0
graduated_at: 2026-05-28  # S0-T11 N=3 中位 4.5/5 ≥ GA
holdout: false

input:
  user_query: |
    告诉我 1+1 等于多少。
    一句话回答即可,不要调任何工具。

expected:
  # 反向: 简单算术不需要任何工具
  execution_must_not_call_tools:
    - bash
    - read
    - write
    - edit
    - grep
    - glob

  # 应直接给答案——避免单字 "2"/"二" 误命中（任何回答都可能含数字 2），
  # 改成必须明确出现"等于 2"或"是 2"这类表达。
  final_response_must_include_any_of:
    - "等于 2"
    - "= 2"
    - "是 2"
    - "结果为 2"
    - "答案是 2"
    - "等于二"

  final_response_must_not_include:
    - "我不会"
    - "请你自己算"
    - "无法回答"

  # final_response 不应太啰嗦
  final_response_max_length: 200

  # 不应跑超过 3 步
  max_steps: 3

rubric:
  token_efficiency_no_overengineering: "简单问题是否直接回答,不调用无关工具"

grader:
  - type: assert
    check: execution_must_not_call_tools_zero_hit
    weight: 0.40
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.20
  - type: assert
    check: max_steps_within_budget
    weight: 0.30
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - token_efficiency_no_overengineering

source: synthetic_capability_2026_05_27_S0_T04
