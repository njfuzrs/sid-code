# Context capability case — large_output_masking 维度
# 触发 grep 大目录,看是否仍能完成后续步骤
#
# Known Limitation (evals/a.md 问题 5):
#   本 case 没有断言"masking 真实生效"——只检查 agent 能否 end_turn + 给出数字。
#   真测 masking 需要:
#     - 跑前/跑后对比 message token 数, masking 后应明显下降
#     - 或注入特殊大输出 fixture, 验证 agent 后续推理使用的是 masked 版本
#   当前 case 等价于"agent 能否完成 grep + 数行任务",对 masking 路径无强制覆盖。
#
# 题面去答案:
#   诱导 agent 选择"必然产生大输出"的策略——禁止用 head/tail/wc 等绕过。
#   即使 agent 用 grep -c 取巧也算合法路径(masking 系统应能 handle 任意 grep 输出量)。

id: case_ctx_005
subsystem: context
dimension: large_output_masking
priority: P1

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

known_limitation:
  type: case_design
  reason: "未断言 masking 真生效,只验证 end_turn + 给出数字;对 masking 路径无强制覆盖"
  resolved_in: "S2/S3 引入 message token 前后对比断言"

input:
  user_query: |
    我想知道这个仓库 node_modules 下,所有 package.json 里写了版本信息的行加起来大概有多少。
    请用合适的工具去统计一下,跑完后告诉我一个大致的数字。

expected:
  # 必须调 grep
  execution_must_call_tools_any_of:
    - grep
    - bash

  # 跑完应有 final_response(说明 masking 后流程没崩)
  final_response_min_length: 20

  # final_response 应给出数字 / 估算
  final_response_must_include_any_of:
    - "数"
    - "个"
    - "约"
    - "总"
    - "package.json"

  # 应在 30 步内完成(掩码生效防止反复读大输出)
  max_steps: 30

  # 应 end_turn 而不是 timeout 或 error
  exit_status_must_be:
    - end_turn

rubric:
  large_output_masking_no_crash: "大输出后流程是否继续推进,无 API 400"
  large_output_masking_reasoning: "agent 是否能基于(可能被遮罩的)大输出给出合理推理"

grader:
  - type: assert
    check: execution_must_call_tools_any_of_hit
    weight: 0.30
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.20
  - type: assert
    check: max_steps_within_budget
    weight: 0.20
  - type: assert
    check: exit_status_must_be_any_of_hit
    weight: 0.20
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - large_output_masking_no_crash
      - large_output_masking_reasoning

source: synthetic_capability_2026_05_27_S0_T04
