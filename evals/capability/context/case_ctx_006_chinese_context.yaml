# Context capability case — chinese_context 维度
# 全中文长输入下,响应应保持中文 + 内容正确

id: case_ctx_006
subsystem: context
dimension: chinese_context
priority: P0

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

input:
  user_query: |
    我们公司的代码评审规范如下,请你阅读并按规范执行后续任务:

    一、命名规范:
    1. 变量名使用小驼峰命名,如 userName,不使用下划线如 user_name。
    2. 类名使用大驼峰命名,如 UserService。
    3. 常量使用全大写下划线,如 MAX_RETRY_COUNT。

    二、注释规范:
    1. 所有公共函数必须有 JSDoc 注释,说明参数和返回值。
    2. 复杂逻辑必须有行内注释,解释 "为什么" 而不是 "做了什么"。
    3. 中文项目允许使用中文注释,但变量名必须用英文。

    三、测试规范:
    1. 所有公共函数必须有对应单测。
    2. 单测覆盖率不低于 80%。
    3. 使用 vitest 作为测试框架,跑命令 `bun test`。

    四、错误处理规范:
    1. 所有可能失败的操作必须有 try-catch。
    2. 错误信息使用中文,方便国内开发者理解。
    3. 关键错误必须记录日志。

    基于上面的规范,请你给一段示例代码:
    一个 UserService 类,含一个公共方法 fetchUser(userId),
    内部用 try-catch 包装,符合所有规范。

expected:
  # final_response 应含中文 + 符合命名规范的代码
  final_response_must_include_any_of:
    - UserService
    - fetchUser
    - userId
    - try
    - catch
    - JSDoc
    - "/**"

  # 反向: 不能用 snake_case
  final_response_must_not_include:
    - user_name
    - user_id
    - max_retry_count

  max_steps: 10

rubric:
  chinese_context_understanding: "是否理解全中文规范的所有条款,生成代码符合"
  chinese_context_no_loss: "中文长输入后是否完整记住所有 4 类规范"

grader:
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.40
  - type: assert
    check: final_response_must_not_include_zero_hit
    weight: 0.30
  - type: assert
    check: max_steps_within_budget
    weight: 0.10
  - type: llm_judge
    weight: 0.20
    rubric_ref:
      - chinese_context_understanding
      - chinese_context_no_loss

