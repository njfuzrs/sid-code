# Context capability case — signal_retention 维度
# 验证: 在较长 user_query 前部嵌入关键信号,后部 query 时 agent 应回答时引用该信号
#
# 题面去答案 (evals/a.md 问题 3):
#   旧版题面把当前栈(Vue 3 + TypeScript + Pinia + PostgreSQL + Express + JWT + bcrypt)
#   和历史栈(Vue 2/Vuex/MySQL/Koa)都直接列出,agent 复读题面任一段即满分。
#   改为"对话式叙述"——栈信号埋在故事中,反例(历史栈)用过去时表达,迫使 agent 真理解
#   "已迁移"语义。echo 排除对代码标识/产品名豁免,所以本质修复是改题面结构。

id: case_ctx_001
subsystem: context
dimension: signal_retention
priority: P0

eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false

input:
  user_query: |
    我接手了一个内部系统,需要给它加一个"忘记密码"功能。
    在动手前我先把项目背景说清楚,这样你能给出契合的方案。

    [项目演进]
    2023 年初做这个系统时,前端用的是当时主流方案,状态管理用 Vuex,
    后端是 Koa,数据库选了 MySQL。那一版上线后跑了大半年。
    2024 年 Q2 团队做了一次比较大的重构:
      - 前端整体迁到了响应式 API 更现代的版本,版本号是 3.x,
        语言换成了带类型系统的那种,状态管理也跟着换成新一代方案;
      - 后端换了一个中间件生态更熟悉的框架,主要因为团队招的人都用过;
      - 数据库迁到了关系更严格、JSON 字段支持更好的开源选项。
    所以,旧版方案早就停用了,现在跑的就是这套重构后的栈。

    [已实现的功能]
    用户登录 / 注册 / 退出三件套都做完了。
    认证机制是这样的:登录时签发短期 access + 长期 refresh 双 token,
    refresh 存在 httpOnly cookie 里防 XSS,access 在内存,刷新时拿 refresh 换新 access。
    密码做了加盐哈希,盐位数取的是行业推荐的偏高档(12)。

    [现在要做的]
    基于上面这套已经在生产跑的栈,
    请你给"忘记密码"功能的实现方案 —— 包括前端表单 / 后端接口 / token 怎么过期 / 通知怎么发。
    方案要紧贴当前栈,不要建议我换框架。
  trigger_plan_mode: false

expected:
  # final_response 应继续使用 Vue 3 / TS / Pinia / PostgreSQL 等当前栈
  # 不能 hallucinate 回 Vue 2 / Vuex / MySQL / Koa
  # 注:这些关键词是代码标识/产品名,echo 豁免 —— 只要 agent 真在回答里提到就算命中
  final_response_must_include_any_of:
    - Vue 3
    - vue 3
    - TypeScript
    - Pinia
    - PostgreSQL
    - postgres
    - Express
    - JWT
    - bcrypt

  # 反向: 不能用旧栈
  final_response_must_not_include:
    - Vue 2
    - vue 2
    - Vuex
    - MySQL
    - mysql
    - Koa
    - "改用 React"
    - "建议改用"

  max_steps: 25

rubric:
  signal_retention_correctness: "回答是否准确引用当前技术栈,不混淆历史栈"
  signal_retention_design_quality: "忘记密码方案是否契合 JWT/bcrypt 这些已知约束"

grader:
  - type: assert
    check: final_response_must_include_any_of_hit
    weight: 0.40
  - type: assert
    check: final_response_must_not_include_zero_hit
    weight: 0.40
  - type: assert
    check: max_steps_within_budget
    weight: 0.10
  - type: llm_judge
    weight: 0.10
    rubric_ref:
      - signal_retention_correctness
      - signal_retention_design_quality

