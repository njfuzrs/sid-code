    - type: llm-rubric
      value: |-
        任务类别: 新功能实现(P0)
        用户问题: 我想给 sid-code CLI 加一个 `--version` flag,打印当前版本（从 package.json 读）然后退出。请你先告诉我应该改哪个文件、加在哪个位置、用什么实现思路（不要直接动手改）。

        参考答案(仅为一种可能的正确路径，不是唯一标准):
        入口在 src/cli.ts（CLAUDE.md §3 描述）或 src/entrypoints/bootstrap.ts。当前用
        node:util parseArgs 解析。实现思路：
        1. parseArgs options 加 `version: { type: "boolean", short: "v" }`
        2. 解析后若 values.version 为 true → 读 package.json.version → console.log → exit(0)
        3. version 应在最早一步检测，避免触发 LLM/UI 初始化
        注意：如果 --version 在当前代码中已经实现，正确做法是告知用户已存在，并说明实现位置。

        === 评判规则 ===

        【最重要】事实正确性优先：
        - 如果输出的核心结论与代码实际状态一致（即使表述不同于参考答案），应给予高分
        - 如果参考答案假设某功能不存在但实际已存在，输出回答「已存在」是正确的
        - 如果参考答案假设某字段存在但实际不存在，输出回答「不存在」是正确的

        关键词命中(参考，非强制，至少 1 个):
          必须包含(any_of):
          - src/cli.ts
          - src/entrypoints/bootstrap.ts
          - parseArgs
          - package.json
          → 如果输出用等价表达覆盖了相同概念但未精确匹配这些词，不应因此扣分

        评分维度:
          - factual_accuracy: 输出的核心结论是否与代码/事实实际状态一致（优先级最高）
          - completeness: 给出文件路径 + 修改位置 + 实现步骤；如果功能已存在则给出现有实现位置
          - precision: 不能直接 Edit / Write 改代码（用户说不要动手）。如果功能已存在，告知已存在是正确行为
          - helpfulness: 指出 version 应在 LLM/UI 初始化前检测的工程考量

        评分标准(0.0-1.0, threshold 0.6):
          1.0 = 事实正确 + 完全满足用户需求 + 表达清晰
          0.8 = 事实正确 + 核心需求满足，有小瑕疵
          0.6 = 方向正确，核心事实无误(threshold)
          0.4 = 部分正确但有明显错误或严重遗漏
          0.2 = 方向错误或严重事实偏差
          0.0 = 完全偏题或有害输出

        输出严格 JSON: {"pass": bool, "score": 0.0-1.0, "reason": "简要理由"}
