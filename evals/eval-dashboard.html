<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sid-code — 评测系统操作台</title>
<link rel="stylesheet" href="https://unpkg.com/@picocss/pico@2/css/pico.min.css">
<style>
:root {
  --pico-font-size: 14px;
  --row-tested: #d1f0d1;
  --row-pending: #f0f0f0;
  --row-error: #f8d0d0;
  --row-legacy: #fff8c8;
  --score-excellent: #2d8f2d;
  --score-good: #5fb35f;
  --score-mid: #d4b020;
  --score-low: #d57f30;
  --score-bad: #c84030;
}
body { padding: 0.5rem 1rem; max-width: 1600px; margin: 0 auto; }
header { padding: 0.5rem 0; border-bottom: 1px solid #ccc; margin-bottom: 1rem; }
header h1 { margin: 0; font-size: 1.4rem; }
header .meta { font-size: 0.85rem; color: #666; }
nav.tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
nav.tabs button { padding: 0.4rem 1rem; cursor: pointer; }
nav.tabs button.active { background: #1095c1; color: #fff; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* === 模拟器 === */
.sim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.sim-panel { padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; }
.sim-panel h3 { margin-top: 0; font-size: 1rem; }
.weight-row { display: grid; grid-template-columns: 140px 1fr 60px 80px; gap: 0.5rem; align-items: center; padding: 0.25rem 0; }
.weight-row .lbl { font-family: monospace; font-size: 0.85rem; }
.weight-row .frozen { color: #d57f30; font-size: 0.7rem; margin-left: 0.25rem; }
.weight-row input[type=range] { width: 100%; }
.weight-row .val { font-family: monospace; text-align: right; font-size: 0.85rem; }
.weight-row .delta { font-family: monospace; text-align: right; font-size: 0.75rem; color: #1095c1; }
.metric-card { padding: 0.4rem; background: #f8f8f8; border-radius: 4px; margin-bottom: 0.4rem; }
.metric-card .lbl { font-size: 0.75rem; color: #666; }
.metric-card .val { font-family: monospace; font-size: 1rem; }
.metric-card .delta-up { color: #2d8f2d; }
.metric-card .delta-dn { color: #c84030; }
.copy-buttons { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.copy-buttons button { font-size: 0.8rem; padding: 0.3rem 0.6rem; }
.copy-buttons button.warning { background: #d57f30; border-color: #d57f30; }

/* === 矩阵 === */
.filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; padding: 0.5rem; background: #f8f8f8; border-radius: 4px; margin-bottom: 0.5rem; }
.filter-bar label { font-size: 0.85rem; }
.filter-bar select, .filter-bar input { font-size: 0.8rem; padding: 0.2rem 0.4rem; }
.matrix-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.matrix-table th, .matrix-table td { padding: 0.25rem 0.4rem; border: 1px solid #ddd; text-align: center; }
.matrix-table th.case-col { text-align: left; min-width: 180px; position: sticky; left: 0; background: #f8f8f8; z-index: 2; }
.matrix-table td.case-col { text-align: left; position: sticky; left: 0; background: #fff; z-index: 1; }
.matrix-table tr.holdout-row td.case-col { border-left: 4px solid #c84030; }
.matrix-table tr.low-score-row { background: #fff5f5; }
.cell-score { font-family: monospace; font-weight: 600; padding: 0.15rem 0.3rem; border-radius: 2px; cursor: pointer; }
.cell-score.s-excellent { background: var(--score-excellent); color: #fff; }
.cell-score.s-good { background: var(--score-good); color: #fff; }
.cell-score.s-mid { background: var(--score-mid); color: #000; }
.cell-score.s-low { background: var(--score-low); color: #fff; }
.cell-score.s-bad { background: var(--score-bad); color: #fff; }
.cell-score.s-pending { color: #999; }
.cell-score.s-legacy { background: var(--row-legacy); color: #000; opacity: 0.7; }
.cell-score.s-error { background: var(--row-error); color: #c84030; }

/* === 散点图 === */
.scatter-container { display: grid; grid-template-columns: 1fr 320px; gap: 1rem; }
.scatter-svg { border: 1px solid #ddd; border-radius: 4px; background: #fafafa; width: 100%; height: 600px; }
.scatter-side .legend { padding: 0.5rem; background: #f8f8f8; border-radius: 4px; font-size: 0.85rem; }

/* === 详情 modal === */
dialog { max-width: 900px; }
dialog pre { font-size: 0.75rem; white-space: pre-wrap; max-height: 60vh; overflow: auto; }
dialog .holdout-warning { background: #c84030; color: #fff; padding: 0.5rem; border-radius: 4px; margin-bottom: 0.5rem; font-weight: bold; }

.toast { position: fixed; bottom: 20px; right: 20px; padding: 0.5rem 1rem; background: #2d8f2d; color: #fff; border-radius: 4px; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.toast.error { background: #c84030; }

.muted { color: #888; font-size: 0.8rem; }
.ok { color: #2d8f2d; }
.warn { color: #d57f30; }
.bad { color: #c84030; }

/* spearman 健康区间 */
.rho-healthy { color: #2d8f2d; }
.rho-warn { color: #d57f30; }
.rho-bad { color: #c84030; }
</style>
</head>
<body>

<header>
  <h1>sid-code — 评测系统操作台</h1>
  <div class="meta" id="meta-line">数据加载中…</div>
</header>

<nav class="tabs">
  <button data-tab="simulator" class="active">权重模拟器(视图 C)</button>
  <button data-tab="matrix">Case 矩阵(视图 A)</button>
  <button data-tab="scatter">难度散点图(视图 A3)</button>
  <button data-tab="alerts">低分告警 + Holdout(视图 A4)</button>
</nav>

<div id="simulator" class="tab-panel active"></div>
<div id="matrix" class="tab-panel"></div>
<div id="scatter" class="tab-panel"></div>
<div id="alerts" class="tab-panel"></div>

<dialog id="case-detail-dialog">
  <article>
    <header>
      <button aria-label="Close" rel="prev" id="dialog-close"></button>
      <strong id="dialog-title">case 详情</strong>
    </header>
    <div id="dialog-body"></div>
  </article>
</dialog>

<dialog id="holdout-warning-dialog">
  <article>
    <header><strong>⚠️ Holdout 警告</strong></header>
    <p>你正在查看一条 <strong>holdout</strong> case。按 CLAUDE.md §0.4 / 评测纪律不变量,holdout 不允许参与优化迭代,仅观察用——查看 transcript 后请勿据此调整 grader / case yaml / system prompt。</p>
    <footer>
      <button id="holdout-ack-btn">我已知晓,继续查看</button>
    </footer>
  </article>
</dialog>

<div id="toast" class="toast"></div>

<script>
// ============================================================
// 全局状态
// ============================================================
const STATE = {
  data: null,
  weights: {},      // 当前模拟权重(用户拖拽中)
  defaultWeights: {},
  graderType: 'rubric_5d',
  filters: {
    priority: '',
    graderType: '',
    bucket: '',
    holdout: 'all',
    sprint: '',
    minScore: '',
    showLegacy: false,
  },
  matrixSort: { col: '_score_avg', dir: 'asc' },
  selectedProvider: null,  // 散点图主 provider
};

// ============================================================
// 启动
// ============================================================
async function boot() {
  try {
    const res = await fetch('eval-data.json?_=' + Date.now());
    if (!res.ok) throw new Error('eval-data.json 加载失败 status=' + res.status);
    STATE.data = await res.json();
    STATE.defaultWeights = { ...STATE.data.meta.defaultWeights };
    STATE.weights = { ...STATE.data.meta.defaultWeights };
    STATE.selectedProvider = STATE.data.meta.providers[0] || null;
    setupTabs();
    renderMeta();
    renderSimulator();
    renderMatrix();
    renderScatter();
    renderAlerts();
  } catch (e) {
    document.body.innerHTML = '<pre style="color:#c84030">eval-data.json 加载失败:\n' + e.message + '\n\n请先 run:\n  bun run eval:dashboard-html\n\n并通过本地 server 起 evals/ 目录(file:// 跨域 fetch 受阻):\n  cd evals && bunx serve\n  # 或 python3 -m http.server</pre>';
  }
}

function setupTabs() {
  document.querySelectorAll('nav.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });
}

function renderMeta() {
  const m = STATE.data.meta;
  document.getElementById('meta-line').textContent =
    `生成 ${m.generatedAt}  ·  ${m.casesTotal} cases · ${m.providers.length} providers · GRADER_VERSION=${m.graderVersion} · holdout ${m.holdoutCount} 条`;
}

// ============================================================
// 工具函数
// ============================================================
function $(id) { return document.getElementById(id); }
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'on') for (const [evt, fn] of Object.entries(v)) e.addEventListener(evt, fn);
    else if (k === 'style') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'data') for (const [dk, dv] of Object.entries(v)) e.dataset[dk] = dv;
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function fmt(n, digits = 2) {
  if (n == null || Number.isNaN(n)) return '–';
  return Number(n).toFixed(digits);
}

function classifyScore(score) {
  if (score == null) return 's-pending';
  if (score >= 4.5) return 's-excellent';
  if (score >= 3.5) return 's-good';
  if (score >= 2.5) return 's-mid';
  if (score >= 1.5) return 's-low';
  return 's-bad';
}

function showToast(msg, isError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.classList.remove('show'); }, 1800);
}

async function copyToClipboard(text, label = '已复制到剪贴板') {
  try {
    await navigator.clipboard.writeText(text);
    showToast(label);
  } catch (e) {
    showToast('复制失败: ' + e.message, true);
  }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}

// ============================================================
// 数据查询(对 STATE.data 的派生)
// ============================================================
function getCasesByGrader(graderType) {
  return STATE.data.cases.filter(c => c.graderType === graderType);
}

function getRunsForCase(caseId, provider = null) {
  return STATE.data.runs.filter(r => r.caseId === caseId && (provider == null || r.provider === provider));
}

function getLatestRun(caseId, provider) {
  const rs = getRunsForCase(caseId, provider);
  if (rs.length === 0) return null;
  return rs.reduce((acc, r) => (acc == null || r.testedAt > acc.testedAt) ? r : acc, null);
}

/**
 * 用当前模拟权重重新加权一条 run 的 namedScores。
 * named_scores 是 0-1 标量,加权后 ×5 转成 0-5 锚点分(与 eval-judge 一致)。
 */
function reweightRun(run, weights) {
  const dims = run.namedScores || {};
  let totalW = 0, sum = 0;
  for (const [dim, w] of Object.entries(weights)) {
    const v = dims[dim];
    if (typeof v !== 'number' || Number.isNaN(v)) continue;
    totalW += w;
    sum += v * w;
  }
  if (totalW === 0) return null;
  return (sum / totalW) * 5;
}

/**
 * Spearman ρ 简单实现(用排名相关替代 pearson)
 */
function spearmanRho(xs, ys) {
  if (xs.length !== ys.length || xs.length < 3) return null;
  const rank = arr => {
    const idx = arr.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
    const r = new Array(arr.length);
    for (let i = 0; i < idx.length; i++) r[idx[i][1]] = i + 1;
    return r;
  };
  const rx = rank(xs), ry = rank(ys);
  const n = xs.length;
  let d2 = 0;
  for (let i = 0; i < n; i++) d2 += (rx[i] - ry[i]) ** 2;
  return 1 - (6 * d2) / (n * (n * n - 1));
}

// ============================================================
// 视图 C — 权重模拟器
// ============================================================
function renderSimulator() {
  const root = $('simulator');
  root.innerHTML = '';
  const m = STATE.data.meta;

  // 头部说明
  root.appendChild(el('div', { class: 'sim-panel' },
    el('h3', {}, '权重调节台 — GRADER_VERSION=' + m.graderVersion),
    el('p', { class: 'muted' },
      '6 维绝对权重(总和=' + Object.values(m.defaultWeights).reduce((a, b) => a + b, 0).toFixed(1) + ',非归一)。改动需走 CLAUDE.md §0.3.1 四件套:① ADR(含 rejected alternatives) ② bump GRADER_VERSION ③ 单测 ④ holdout 验证。efficiency / cost 自 5d-v2 起为诊断模式(权重 0),调高需走流程。'),
    el('p', {},
      el('strong', {}, '数据源:'), ' evals/_runs/{provider}.jsonl 的 named_scores;不读 baseline_scores.dimensions(那是同步快照,grader 漂移时字段集会变)。'),
  ));

  // grader_type 切换
  const graderTabs = el('div', { class: 'sim-panel', style: { marginTop: '0.5rem' } });
  graderTabs.appendChild(el('h3', {}, 'Grader 分组'));
  const tabsWrap = el('div', { style: { display: 'flex', gap: '0.5rem', flexWrap: 'wrap' } });
  for (const [bucket, ids] of Object.entries(STATE.data.graderBuckets)) {
    const btn = el('button', {
      class: STATE.graderType === bucket ? '' : 'secondary',
      on: { click: () => { STATE.graderType = bucket; renderSimulator(); } },
    }, `${bucket} (${ids.length} cases)`);
    tabsWrap.appendChild(btn);
  }
  graderTabs.appendChild(tabsWrap);
  graderTabs.appendChild(el('p', { class: 'muted', style: { marginTop: '0.5rem' } },
    '⚠️ 不同 grader_type 的打分语义不同(5d 加权 / binary 0-1 / structured 结构化),不能跨组聚合。'));
  root.appendChild(graderTabs);

  // 双栏:左边滑条,右边实时模拟
  const grid = el('div', { class: 'sim-grid', style: { marginTop: '1rem' } });

  const leftPanel = el('div', { class: 'sim-panel' });
  leftPanel.appendChild(el('h3', {}, '维度权重'));

  const dims = ['anchor_hit', 'rubric_score', 'tool_compliance', 'negative_anchor', 'efficiency', 'cost'];
  for (const dim of dims) {
    const w = STATE.weights[dim] ?? 0;
    const wDef = STATE.defaultWeights[dim] ?? 0;
    const isFrozen = wDef === 0;
    const row = el('div', { class: 'weight-row' },
      el('span', { class: 'lbl' }, dim, isFrozen ? el('span', { class: 'frozen' }, '[冻结]') : ''),
      el('input', {
        type: 'range', min: '0', max: '5', step: '0.1', value: String(w),
        on: {
          input: (ev) => {
            STATE.weights[dim] = parseFloat(ev.target.value);
            updateSimMetrics();
            ev.target.parentElement.querySelector('.val').textContent = STATE.weights[dim].toFixed(1);
            const dEl = ev.target.parentElement.querySelector('.delta');
            const d = STATE.weights[dim] - wDef;
            dEl.textContent = (d >= 0 ? '+' : '') + d.toFixed(1);
          },
        },
      }),
      el('span', { class: 'val' }, w.toFixed(1)),
      el('span', { class: 'delta' }, ((w - wDef) >= 0 ? '+' : '') + (w - wDef).toFixed(1) + ' (默认' + wDef.toFixed(1) + ')'),
    );
    leftPanel.appendChild(row);
  }

  // 重置按钮
  leftPanel.appendChild(el('div', { style: { marginTop: '0.5rem' } },
    el('button', {
      class: 'secondary',
      on: { click: () => { STATE.weights = { ...STATE.defaultWeights }; renderSimulator(); } },
    }, '重置为默认'),
  ));

  grid.appendChild(leftPanel);

  // 右栏 metrics
  const rightPanel = el('div', { class: 'sim-panel' });
  rightPanel.appendChild(el('h3', {}, '实时模拟'));
  rightPanel.appendChild(el('div', { id: 'sim-metrics' }));
  rightPanel.appendChild(el('div', { class: 'copy-buttons', id: 'sim-copy-btns' }));
  grid.appendChild(rightPanel);

  root.appendChild(grid);

  updateSimMetrics();
  renderSimCopyButtons();
}

function updateSimMetrics() {
  const root = $('sim-metrics');
  if (!root) return;
  const graderType = STATE.graderType;
  const cases = getCasesByGrader(graderType);
  if (cases.length === 0) {
    root.innerHTML = '<p class="muted">该 grader_type 下没有 case</p>';
    return;
  }

  // 每条 case 取最新一次 run(任意 provider 都行,模拟器关注的是"权重一变,分数往哪偏")
  // 用第一个 provider 的 latest run;如果没有,跳过
  const provider = STATE.selectedProvider || STATE.data.meta.providers[0];
  const oldScores = [], newScores = [];
  const perCaseDelta = [];
  let holdoutOldSum = 0, holdoutNewSum = 0, holdoutN = 0;
  let crossedGA = 0, fellBelowGA = 0;
  const archivedRubric = [], archivedAnchor = [];

  for (const c of cases) {
    const run = getLatestRun(c.id, provider);
    if (!run) continue;
    const oldScore = reweightRun(run, STATE.defaultWeights);
    const newScore = reweightRun(run, STATE.weights);
    if (oldScore == null || newScore == null) continue;
    oldScores.push(oldScore);
    newScores.push(newScore);
    perCaseDelta.push({ id: c.id, delta: newScore - oldScore });
    if (c.isHoldout) {
      holdoutOldSum += oldScore;
      holdoutNewSum += newScore;
      holdoutN++;
    }
    if (oldScore < 3.5 && newScore >= 3.5) crossedGA++;
    if (oldScore >= 3.5 && newScore < 3.5) fellBelowGA++;
    const ns = run.namedScores || {};
    if (typeof ns.rubric_score === 'number' && typeof ns.anchor_hit === 'number') {
      archivedRubric.push(ns.rubric_score);
      archivedAnchor.push(ns.anchor_hit);
    }
  }

  if (oldScores.length === 0) {
    root.innerHTML = `<p class="muted">该 grader_type(${graderType}) 没有 ${provider} 的运行数据。请先跑一次 eval:run。</p>`;
    return;
  }

  const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
  const oldAvg = avg(oldScores), newAvg = avg(newScores);
  const maxShift = perCaseDelta.reduce((acc, x) => Math.abs(x.delta) > Math.abs(acc.delta) ? x : acc, { id: '–', delta: 0 });
  const rho = spearmanRho(archivedRubric, archivedAnchor);
  const rhoCls = rho == null ? '' : (rho >= 0.6 && rho <= 0.9 ? 'rho-healthy' : (rho >= 0.4 ? 'rho-warn' : 'rho-bad'));
  const rhoTxt = rho == null ? '–' : rho.toFixed(2);

  root.innerHTML = '';
  const card = (lbl, val, delta) => {
    const c = el('div', { class: 'metric-card' });
    c.appendChild(el('div', { class: 'lbl' }, lbl));
    c.appendChild(el('div', { class: 'val' }, val));
    if (delta != null) c.appendChild(el('div', { class: 'delta ' + (delta >= 0 ? 'delta-up' : 'delta-dn') }, (delta >= 0 ? '+' : '') + fmt(delta, 3)));
    return c;
  };
  root.appendChild(card(
    `${graderType} 平均分(${oldScores.length} cases · provider=${provider})`,
    `${fmt(oldAvg, 2)} → ${fmt(newAvg, 2)}`,
    newAvg - oldAvg,
  ));
  if (holdoutN > 0) {
    root.appendChild(card(
      `Holdout 偏移(${holdoutN} 条)⚠️`,
      `${fmt(holdoutOldSum / holdoutN, 2)} → ${fmt(holdoutNewSum / holdoutN, 2)}`,
      (holdoutNewSum - holdoutOldSum) / holdoutN,
    ));
  } else {
    root.appendChild(card('Holdout 偏移', '该 grader 组无 holdout case', null));
  }
  root.appendChild(card('跨过 GA 线(3.5)', `+${crossedGA} / -${fellBelowGA}`, null));
  root.appendChild(card('最大单 case 偏移', `${maxShift.id} ${maxShift.delta >= 0 ? '+' : ''}${fmt(maxShift.delta, 2)}`, null));
  const rhoEl = card('rubric vs anchor_hit Spearman ρ(健康 [0.6, 0.9])', rhoTxt, null);
  rhoEl.querySelector('.val').classList.add(rhoCls);
  root.appendChild(rhoEl);
}

function renderSimCopyButtons() {
  const root = $('sim-copy-btns');
  if (!root) return;
  root.innerHTML = '';
  root.appendChild(el('button', { on: { click: () => copyAdrDraft() } }, '📋 复制 ADR 草稿'));
  root.appendChild(el('button', { on: { click: () => copyBumpDiff() } }, '📋 复制 GRADER_VERSION bump diff'));
  root.appendChild(el('button', { on: { click: () => copyTestStub() } }, '📋 复制单测 stub'));
  root.appendChild(el('button', { on: { click: () => copyHoldoutScript() } }, '📋 复制 holdout 验证脚本'));
}

function copyAdrDraft() {
  const m = STATE.data.meta;
  const w = STATE.weights, d = STATE.defaultWeights;
  const today = new Date().toISOString().slice(0, 10);
  const provider = STATE.selectedProvider || m.providers[0];

  // 收集模拟器输出快照
  const cases = getCasesByGrader(STATE.graderType);
  let oldSum = 0, newSum = 0, n = 0;
  for (const c of cases) {
    const run = getLatestRun(c.id, provider);
    if (!run) continue;
    const oldS = reweightRun(run, d), newS = reweightRun(run, w);
    if (oldS == null || newS == null) continue;
    oldSum += oldS; newSum += newS; n++;
  }
  const drift = n > 0 ? (newSum - oldSum) / n : 0;

  const next = bumpVersion(m.graderVersion);
  const txt = `# ADR 00XX: Grader weights bump ${m.graderVersion} → ${next}

## Status
Proposed (auto-generated by eval-dashboard.html on ${today})

## Context
当前权重 vs 提议权重(grader_type=${STATE.graderType},数据 provider=${provider},${n} cases):

| 维度 | 当前 | 提议 | Δ |
| --- | --- | --- | --- |
${Object.keys(w).map(k => `| ${k} | ${d[k].toFixed(1)} | ${w[k].toFixed(1)} | ${(w[k] - d[k] >= 0 ? '+' : '') + (w[k] - d[k]).toFixed(1)} |`).join('\n')}

模拟器输出(${STATE.graderType} 组平均分):
- 总平均: ${fmt(oldSum / Math.max(n, 1), 2)} → ${fmt(newSum / Math.max(n, 1), 2)} (Δ ${drift >= 0 ? '+' : ''}${fmt(drift, 3)})

## Decision
DEFAULT_WEIGHTS 改为:
\`\`\`ts
export const DEFAULT_WEIGHTS: Record<string, number> = {
${Object.keys(w).map(k => `  ${k}: ${w[k].toFixed(1)},`).join('\n')}
};
\`\`\`

GRADER_VERSION bump: \`${m.graderVersion}\` → \`${next}\`

## Rejected alternatives
(必填,不允许空——CLAUDE.md §0.7 红线)

1. **维持现状**:不改的代价 / 当前权重为何不够
2. **改更激进**:为何不进一步拉大某维度权重
3. **降权 rubric**:rubric_score 当前 4.0 是否过高,为何不调到 3.0
4. **增加新维度**:与其调权重,为何不引入新维度

## Consequences
- 受影响 case: ${n} 条 ${STATE.graderType} 类
- holdout 偏移: 模拟器测算 = ${fmt(drift, 3)} (绝对值需 < 0.5)
- sprint baseline 重跑成本: bump 后 \`evals/_runs/*.jsonl\` 旧版本数据按 \`_formula_version.grader\` 字段过滤,与新版本不可混算
- 需同步修改:
  - evals/eval-judge.ts:GRADER_VERSION 与 DEFAULT_WEIGHTS
  - scripts/eval/lib/yaml-loader.ts:LATEST_GRADER_VERSION
  - scripts/eval/build-dashboard-html.ts:DEFAULT_WEIGHTS_5D_V3 与 GRADER_VERSION
  - evals/eval-judge.test.ts:加单测
`;
  copyToClipboard(txt, '已复制 ADR 草稿');
}

function bumpVersion(v) {
  // 5d-v3 → 5d-v4
  const m = v.match(/^(.*v)(\d+)$/);
  if (!m) return v + '-next';
  return m[1] + (parseInt(m[2], 10) + 1);
}

function copyBumpDiff() {
  const m = STATE.data.meta;
  const w = STATE.weights, d = STATE.defaultWeights;
  const next = bumpVersion(m.graderVersion);

  const lines = [];
  lines.push(`-export const GRADER_VERSION = "${m.graderVersion}";`);
  lines.push(`+export const GRADER_VERSION = "${next}";`);
  lines.push('');
  lines.push(' export const DEFAULT_WEIGHTS: Record<string, number> = {');
  for (const k of Object.keys(w)) {
    if (Math.abs(w[k] - d[k]) < 1e-9) {
      lines.push(`   ${k}: ${w[k].toFixed(1)},`);
    } else {
      lines.push(`-  ${k}: ${d[k].toFixed(1)},`);
      lines.push(`+  ${k}: ${w[k].toFixed(1)},`);
    }
  }
  lines.push(' };');
  copyToClipboard(lines.join('\n'), '已复制 bump diff');
}

function applyMatrixFilters(cases) {
  const f = STATE.filters;
  return cases.filter(c => {
    if (f.priority && c.priority !== f.priority) return false;
    if (f.graderType && c.graderType !== f.graderType) return false;
    if (f.bucket && c.bucket !== f.bucket) return false;
    if (f.holdout === 'only' && !c.isHoldout) return false;
    if (f.holdout === 'exclude' && c.isHoldout) return false;
    if (f.idQuery && !c.id.includes(f.idQuery) && !c.bucket.includes(f.idQuery)) return false;
    return true;
  });
}

function caseAvgScore(c, providers) {
  const vals = [];
  for (const p of providers) {
    const cell = c.baseline[p];
    if (cell && typeof cell.score === 'number') vals.push(cell.score);
  }
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function renderMatrixTable() {
  const wrap = $('matrix-table-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';

  const providers = STATE.data.meta.providers;
  let cases = applyMatrixFilters(STATE.data.cases);

  // 应用 minScore 过滤(任一 provider 分数低于阈值才保留)
  if (STATE.filters.minScore !== '' && STATE.filters.minScore != null) {
    const th = parseFloat(STATE.filters.minScore);
    if (!Number.isNaN(th)) {
      cases = cases.filter(c => {
        for (const p of providers) {
          const cell = c.baseline[p];
          if (cell && typeof cell.score === 'number' && cell.score < th) return true;
        }
        return false;
      });
    }
  }

  // 排序:默认低分优先
  cases.sort((a, b) => {
    const sa = caseAvgScore(a, providers);
    const sb = caseAvgScore(b, providers);
    if (sa == null && sb == null) return a.id.localeCompare(b.id);
    if (sa == null) return 1;
    if (sb == null) return -1;
    return sa - sb;
  });

  const table = el('table', { class: 'matrix-table' });
  const thead = el('thead');
  const tr = el('tr');
  tr.appendChild(el('th', { class: 'case-col' }, 'Case (bucket / category)'));
  tr.appendChild(el('th', {}, 'grader'));
  tr.appendChild(el('th', {}, '均分'));
  for (const p of providers) tr.appendChild(el('th', { title: p }, p.length > 18 ? p.slice(0, 18) + '…' : p));
  thead.appendChild(tr);
  table.appendChild(thead);

  const tbody = el('tbody');
  let lowScoreCount = 0, holdoutCount = 0;
  for (const c of cases) {
    const avg = caseAvgScore(c, providers);
    const rowCls = [];
    if (c.isHoldout) { rowCls.push('holdout-row'); holdoutCount++; }
    if (avg != null && avg < 4.0) { rowCls.push('low-score-row'); lowScoreCount++; }
    const row = el('tr', { class: rowCls.join(' ') });

    const titleCell = el('td', { class: 'case-col' });
    const link = el('a', {
      href: '#', on: { click: (e) => { e.preventDefault(); openCaseDetail(c); } },
    }, c.id);
    titleCell.appendChild(link);
    titleCell.appendChild(el('div', { class: 'muted', style: { fontSize: '0.7rem' } },
      `${c.bucket} · ${c.category || '–'} · ${c.priority || '–'}${c.isHoldout ? ' · 🔒HOLDOUT' : ''}`,
    ));
    row.appendChild(titleCell);

    row.appendChild(el('td', {}, c.graderType));
    row.appendChild(el('td', {}, avg == null ? '–' : avg.toFixed(2)));

    for (const p of providers) {
      const cell = c.baseline[p];
      const td = el('td');
      if (!cell) {
        td.appendChild(el('span', { class: 'cell-score s-pending' }, '–'));
      } else if (cell.status === 'legacy' && !STATE.filters.showLegacy) {
        td.appendChild(el('span', {
          class: 'cell-score s-legacy',
          title: `legacy grader=${cell.graderVersion ?? 'null'}`,
          on: { click: () => openCaseCellDetail(c, p) },
        }, '🟨' + fmt(cell.score, 1)));
      } else if (cell.status === 'error' || cell.status === 'timeout') {
        td.appendChild(el('span', {
          class: 'cell-score s-error',
          on: { click: () => openCaseCellDetail(c, p) },
        }, cell.status === 'error' ? '❌' : '⏱️'));
      } else if (cell.score == null) {
        td.appendChild(el('span', { class: 'cell-score s-pending' }, '–'));
      } else {
        td.appendChild(el('span', {
          class: 'cell-score ' + classifyScore(cell.score),
          on: { click: () => openCaseCellDetail(c, p) },
          title: `tested_at=${cell.testedAt}\ngrader=${cell.graderVersion ?? '–'}\ncost=${cell.costVersion ?? '–'}`,
        }, fmt(cell.score, 2)));
      }
      row.appendChild(td);
    }
    tbody.appendChild(row);
  }
  table.appendChild(tbody);

  wrap.appendChild(el('p', { class: 'muted' },
    `共 ${cases.length} cases · 低分(<4.0) ${lowScoreCount} · holdout ${holdoutCount}`,
  ));
  wrap.appendChild(table);
}

function drawScatter() {
  const wrap = $('scatter-svg-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';

  const provider = STATE.selectedProvider;
  const providers = STATE.data.meta.providers;
  let cases = STATE.data.cases.slice();
  if (STATE.scatterGrader) cases = cases.filter(c => c.graderType === STATE.scatterGrader);
  if (!STATE.scatterShowHoldout) cases = cases.filter(c => !c.isHoldout);

  const points = [];
  for (const c of cases) {
    const xs = [];
    for (const p of providers) {
      const cell = c.baseline[p];
      if (cell && typeof cell.score === 'number') xs.push(cell.score);
    }
    if (xs.length === 0) continue;
    const avg = xs.reduce((a, b) => a + b, 0) / xs.length;
    const cell = c.baseline[provider];
    if (!cell || typeof cell.score !== 'number') continue;
    points.push({ id: c.id, x: avg, y: cell.score, holdout: c.isHoldout, grader: c.graderType });
  }

  // 绘 SVG 散点(0–5 范围)
  const W = 800, H = 600, M = 50;
  const xMin = 0, xMax = 5, yMin = 0, yMax = 5;
  const sx = v => M + (v - xMin) / (xMax - xMin) * (W - 2 * M);
  const sy = v => H - M - (v - yMin) / (yMax - yMin) * (H - 2 * M);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'scatter-svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  // 网格
  for (let i = 0; i <= 5; i++) {
    const gx = sx(i), gy = sy(i);
    const lx = document.createElementNS(ns, 'line');
    lx.setAttribute('x1', gx); lx.setAttribute('y1', sy(0));
    lx.setAttribute('x2', gx); lx.setAttribute('y2', sy(5));
    lx.setAttribute('stroke', '#eee');
    svg.appendChild(lx);
    const ly = document.createElementNS(ns, 'line');
    ly.setAttribute('x1', sx(0)); ly.setAttribute('y1', gy);
    ly.setAttribute('x2', sx(5)); ly.setAttribute('y2', gy);
    ly.setAttribute('stroke', '#eee');
    svg.appendChild(ly);
    const tx = document.createElementNS(ns, 'text');
    tx.setAttribute('x', gx); tx.setAttribute('y', sy(0) + 14);
    tx.setAttribute('text-anchor', 'middle'); tx.setAttribute('font-size', '10');
    tx.textContent = i; svg.appendChild(tx);
    const ty = document.createElementNS(ns, 'text');
    ty.setAttribute('x', sx(0) - 6); ty.setAttribute('y', gy + 4);
    ty.setAttribute('text-anchor', 'end'); ty.setAttribute('font-size', '10');
    ty.textContent = i; svg.appendChild(ty);
  }

  // y=x 对角线
  const diag = document.createElementNS(ns, 'line');
  diag.setAttribute('x1', sx(0)); diag.setAttribute('y1', sy(0));
  diag.setAttribute('x2', sx(5)); diag.setAttribute('y2', sy(5));
  diag.setAttribute('stroke', '#888'); diag.setAttribute('stroke-dasharray', '4,4');
  svg.appendChild(diag);

  // GA 线 3.5
  const ga = document.createElementNS(ns, 'line');
  ga.setAttribute('x1', sx(0)); ga.setAttribute('y1', sy(3.5));
  ga.setAttribute('x2', sx(5)); ga.setAttribute('y2', sy(3.5));
  ga.setAttribute('stroke', '#1095c1'); ga.setAttribute('stroke-dasharray', '6,3');
  svg.appendChild(ga);
  const gaT = document.createElementNS(ns, 'text');
  gaT.setAttribute('x', sx(5) - 4); gaT.setAttribute('y', sy(3.5) - 4);
  gaT.setAttribute('text-anchor', 'end'); gaT.setAttribute('font-size', '11');
  gaT.setAttribute('fill', '#1095c1'); gaT.textContent = 'GA 3.5';
  svg.appendChild(gaT);

  // 数据点
  let belowDiag = 0, aboveDiag = 0;
  const drillList = [];
  for (const p of points) {
    const cx = sx(p.x), cy = sy(p.y);
    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
    dot.setAttribute('r', p.holdout ? 5 : 3.5);
    dot.setAttribute('fill', p.holdout ? '#c84030' : (p.y < p.x ? '#d57f30' : '#1095c1'));
    dot.setAttribute('opacity', '0.7');
    dot.setAttribute('cursor', 'pointer');
    dot.addEventListener('click', () => {
      const c = STATE.data.cases.find(c => c.id === p.id);
      if (c) openCaseDetail(c);
    });
    const titleEl = document.createElementNS(ns, 'title');
    titleEl.textContent = `${p.id}\n全员平均(难度) ${p.x.toFixed(2)} → ${provider} ${p.y.toFixed(2)}\nΔ=${(p.y - p.x).toFixed(2)}`;
    dot.appendChild(titleEl);
    svg.appendChild(dot);
    if (p.y < p.x) {
      belowDiag++;
      drillList.push({ id: p.id, delta: p.y - p.x });
    } else {
      aboveDiag++;
    }
  }

  // 轴标题
  const xLab = document.createElementNS(ns, 'text');
  xLab.setAttribute('x', W / 2); xLab.setAttribute('y', H - 8);
  xLab.setAttribute('text-anchor', 'middle'); xLab.setAttribute('font-size', '12');
  xLab.textContent = 'X = 全 provider 平均(case 难度反指标,越右越简单)';
  svg.appendChild(xLab);
  const yLab = document.createElementNS(ns, 'text');
  yLab.setAttribute('x', -H / 2); yLab.setAttribute('y', 14);
  yLab.setAttribute('transform', 'rotate(-90)');
  yLab.setAttribute('text-anchor', 'middle'); yLab.setAttribute('font-size', '12');
  yLab.textContent = 'Y = ' + provider + ' 分数';
  svg.appendChild(yLab);

  wrap.appendChild(svg);

  // 旁栏
  const stats = $('scatter-stats');
  if (stats) {
    stats.innerHTML = '';
    stats.appendChild(el('p', {},
      `${provider}: ${points.length} cases · 低于对角(偏弱) ${belowDiag} · 高于对角(偏强) ${aboveDiag}`,
    ));
  }
  const drill = $('scatter-drill');
  if (drill) {
    drill.innerHTML = '';
    drillList.sort((a, b) => a.delta - b.delta);
    const top = drillList.slice(0, 10);
    if (top.length === 0) {
      drill.appendChild(el('p', { class: 'muted' }, '该 provider 在所有 case 上都 ≥ 全员平均'));
    } else {
      drill.appendChild(el('p', { class: 'muted', style: { margin: '0 0 0.4rem 0' } }, '该 provider 偏弱 Top10(全员都强、它弱):'));
      for (const d of top) {
        const a = el('a', {
          href: '#',
          on: {
            click: (e) => {
              e.preventDefault();
              const c = STATE.data.cases.find(c => c.id === d.id);
              if (c) openCaseDetail(c);
            },
          },
        }, `${d.id} Δ=${d.delta.toFixed(2)}`);
        drill.appendChild(el('div', { style: { fontSize: '0.78rem' } }, a));
      }
    }
  }
}

// ============================================================
// 视图 A4 — 低分告警 + Holdout
// ============================================================
function renderAlerts() {
  const root = $('alerts');
  root.innerHTML = '';

  const providers = STATE.data.meta.providers;
  const lowCases = [];
  const pendingCases = [];
  for (const c of STATE.data.cases) {
    if (c.isHoldout) continue;
    const avg = caseAvgScore(c, providers);
    if (avg == null) {
      pendingCases.push(c);
    } else if (avg < 4.0) {
      lowCases.push({ ...c, _avg: avg });
    }
  }
  lowCases.sort((a, b) => a._avg - b._avg);
  const holdoutCases = STATE.data.cases.filter(c => c.isHoldout);

  // 低分卡片
  const lowPanel = el('div', { class: 'sim-panel' });
  lowPanel.appendChild(el('h3', {}, `低分告警(score<4.0,排除 holdout):${lowCases.length} 条`));
  if (lowCases.length === 0) {
    lowPanel.appendChild(el('p', { class: 'ok' }, '✅ 无低分 case'));
  }
  for (const c of lowCases.slice(0, 50)) {
    const card = el('details', { style: { padding: '0.4rem 0', borderBottom: '1px solid #eee' } });
    card.appendChild(el('summary', {}, `${c.id} · avg ${fmt(c._avg, 2)} · ${c.graderType} · ${c.priority || '–'} · ${c.bucket}`));
    const body = el('div', { style: { padding: '0.5rem 0' } });
    body.appendChild(el('div', { class: 'muted' }, c.userQuery));
    const tab = el('table', { style: { width: '100%', fontSize: '0.78rem', marginTop: '0.4rem' } });
    const thead = el('thead');
    thead.appendChild(el('tr',
      {},
      el('th', {}, 'provider'),
      el('th', {}, 'score'),
      el('th', {}, 'grader'),
      el('th', {}, 'cost ver'),
      el('th', {}, 'tested_at'),
      el('th', {}, 'dimensions'),
      el('th', {}, 'transcript'),
    ));
    tab.appendChild(thead);
    const tbody = el('tbody');
    for (const p of providers) {
      const cell = c.baseline[p];
      if (!cell) continue;
      const dims = cell.dimensions || {};
      const dimsTxt = Object.entries(dims).filter(([, v]) => v != null).map(([k, v]) => `${k}=${fmt(v, 2)}`).join(' ');
      tbody.appendChild(el('tr', {},
        el('td', {}, p),
        el('td', {}, cell.score == null ? '–' : fmt(cell.score, 2)),
        el('td', {}, cell.graderVersion || '–'),
        el('td', {}, cell.costVersion || '–'),
        el('td', { style: { fontSize: '0.7rem' } }, cell.testedAt || '–'),
        el('td', { style: { fontSize: '0.7rem' } }, dimsTxt || '–'),
        el('td', { style: { fontSize: '0.7rem' } }, (cell.notes && cell.notes.includes('transcript')) ? cell.notes.slice(0, 60) : '–'),
      ));
    }
    tab.appendChild(tbody);
    body.appendChild(tab);
    card.appendChild(body);
    lowPanel.appendChild(card);
  }
  if (lowCases.length > 50) {
    lowPanel.appendChild(el('p', { class: 'muted' }, `(还有 ${lowCases.length - 50} 条未显示,用矩阵视图过滤查看)`));
  }
  root.appendChild(lowPanel);

  // pending
  if (pendingCases.length > 0) {
    const p = el('div', { class: 'sim-panel', style: { marginTop: '0.75rem' } });
    p.appendChild(el('h3', {}, `Pending(无任何 baseline_scores 数据):${pendingCases.length} 条`));
    p.appendChild(el('p', { class: 'muted' },
      pendingCases.slice(0, 30).map(c => c.id).join(', ') + (pendingCases.length > 30 ? ` (+${pendingCases.length - 30})` : ''),
    ));
    root.appendChild(p);
  }

  // Holdout 红色警告区
  const hPanel = el('div', { class: 'sim-panel', style: { marginTop: '0.75rem', border: '2px solid #c84030' } });
  hPanel.appendChild(el('h3', { class: 'bad' }, `🔒 Holdout 区(${holdoutCases.length} 条 · 不允许参与优化迭代,仅观察)`));
  hPanel.appendChild(el('p', { class: 'warn' },
    '展开前需确认。按 CLAUDE.md §0.4 评测纪律不变量,holdout case 不允许参与任何 grader 调优 / case 调优 / system prompt 调优。'));
  const hDetails = el('details');
  hDetails.appendChild(el('summary', {}, '展开 holdout 列表(需弹窗确认)'));
  const hBody = el('div', { style: { padding: '0.5rem 0' } });
  for (const c of holdoutCases) {
    hBody.appendChild(el('div', {},
      el('a', {
        href: '#',
        on: {
          click: (e) => {
            e.preventDefault();
            $('holdout-warning-dialog').showModal();
            $('holdout-ack-btn').onclick = () => {
              $('holdout-warning-dialog').close();
              openCaseDetail(c);
            };
          },
        },
      }, `${c.id} · ${c.graderType} · ${c.bucket}`),
    ));
  }
  hDetails.appendChild(hBody);
  hPanel.appendChild(hDetails);
  root.appendChild(hPanel);
}

// ============================================================
// Case 详情 modal
// ============================================================
function openCaseDetail(c) {
  if (c.isHoldout) {
    const dlg = $('holdout-warning-dialog');
    if (!dlg.dataset.acked) {
      dlg.showModal();
      $('holdout-ack-btn').onclick = () => {
        dlg.dataset.acked = '1';
        dlg.close();
        showCaseDetail(c);
      };
      return;
    }
  }
  showCaseDetail(c);
}

function openCaseCellDetail(c, provider) {
  STATE.detailFocusProvider = provider;
  openCaseDetail(c);
}

function showCaseDetail(c) {
  const dlg = $('case-detail-dialog');
  $('dialog-title').textContent = `${c.id} ${c.isHoldout ? '🔒 HOLDOUT' : ''}`;
  const body = $('dialog-body');
  body.innerHTML = '';

  if (c.isHoldout) {
    body.appendChild(el('div', { class: 'holdout-warning' }, '⚠️ 该 case 为 holdout,仅供观察,不允许据此调整 grader / case yaml / system prompt'));
  }
  body.appendChild(el('div', { class: 'muted' },
    `${c.bucket} · ${c.category || '–'} · ${c.priority || '–'} · grader=${c.graderType} · target=${c.targetScore ?? '–'}`,
  ));
  body.appendChild(el('h4', {}, 'user_query'));
  body.appendChild(el('pre', {}, c.userQuery));

  body.appendChild(el('h4', {}, 'baseline_scores'));
  const t = el('table', { style: { width: '100%', fontSize: '0.78rem' } });
  t.appendChild(el('thead', {}, el('tr', {},
    el('th', {}, 'provider'), el('th', {}, 'score'), el('th', {}, 'grader'), el('th', {}, 'cost ver'), el('th', {}, 'tested_at'),
  )));
  const tb = el('tbody');
  for (const [p, cell] of Object.entries(c.baseline)) {
    const tr = el('tr', {},
      el('td', {}, p),
      el('td', {}, cell.score == null ? '–' : fmt(cell.score, 2)),
      el('td', {}, cell.graderVersion || '–'),
      el('td', {}, cell.costVersion || '–'),
      el('td', { style: { fontSize: '0.7rem' } }, cell.testedAt || '–'),
    );
    if (p === STATE.detailFocusProvider) tr.style.background = '#fff8d0';
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  body.appendChild(t);

  // 历史 runs
  const runs = STATE.data.runs.filter(r => r.caseId === c.id);
  if (runs.length > 0) {
    body.appendChild(el('h4', {}, `_runs 历史(${runs.length} 条)`));
    const rt = el('table', { style: { width: '100%', fontSize: '0.75rem' } });
    rt.appendChild(el('thead', {}, el('tr', {},
      el('th', {}, 'tested_at'), el('th', {}, 'provider'), el('th', {}, 'score'), el('th', {}, 'named_scores'), el('th', {}, 'latency'), el('th', {}, 'status'),
    )));
    const rtb = el('tbody');
    runs.slice(-10).reverse().forEach(r => {
      const ns = Object.entries(r.namedScores || {}).map(([k, v]) => `${k}=${fmt(v, 2)}`).join(' ');
      rtb.appendChild(el('tr', {},
        el('td', { style: { fontSize: '0.7rem' } }, r.testedAt),
        el('td', {}, r.provider),
        el('td', {}, r.score == null ? '–' : fmt(r.score, 2)),
        el('td', { style: { fontSize: '0.7rem' } }, ns),
        el('td', {}, fmt(r.latencyMs / 1000, 1) + 's'),
        el('td', {}, r.runStatus),
      ));
    });
    rt.appendChild(rtb);
    body.appendChild(rt);
  }

  body.appendChild(el('h4', {}, '复制为 case 调试 Prompt'));
  body.appendChild(el('button', {
    on: { click: () => copyCaseDebugPrompt(c) },
  }, '📋 复制 case 调试 Prompt'));

  body.appendChild(el('p', { class: 'muted', style: { marginTop: '0.6rem' } }, `源文件: ${c.filePath}`));

  dlg.showModal();
  $('dialog-close').onclick = () => dlg.close();
}

function copyCaseDebugPrompt(c) {
  const runs = STATE.data.runs.filter(r => r.caseId === c.id);
  const latest = runs.length === 0 ? null : runs.reduce((acc, r) => (acc == null || r.testedAt > acc.testedAt) ? r : acc, null);
  const baselineLines = Object.entries(c.baseline)
    .map(([p, cell]) => `- ${p}: score=${cell.score == null ? '–' : cell.score} grader=${cell.graderVersion ?? '–'} cost=${cell.costVersion ?? '–'} tested_at=${cell.testedAt ?? '–'}`)
    .join('\n');
  const txt = `请帮我诊断 case ${c.id}。

源文件: ${c.filePath}
分类: ${c.bucket} / ${c.category || '–'} / ${c.priority || '–'}
grader_type: ${c.graderType}
holdout: ${c.isHoldout ? 'true ⚠️ 不允许据此调优' : 'false'}

User query:
${c.userQuery}

baseline_scores:
${baselineLines}

最近一次 run(${latest ? latest.testedAt : '无'}):
${latest ? JSON.stringify(latest, null, 2) : '(无 _runs 数据)'}

请:
1. 阅读源 yaml 中的 expected 段(must_include_any_of / must_not_include / must_call_tools / max_steps / reference_answer / rubric)
2. 对照最近 transcript 判断:① 是否答案合规 ② 是否锚点漏命中 ③ 是否走了多余工具
3. 判断 fix_type ∈ {case_design, skill_prompt, infra_bug, entry_code, core_code, new_module}
4. 给出 root_cause + 修复路径(若涉及 grader 改动需走 §0.3.1 四件套)

约束:
- 该 case ${c.isHoldout ? '⚠️ 是 holdout,只能给"观察结论",禁止给优化建议' : '不是 holdout,可给优化建议'}
- 改 src/ 按 §0.3 fix_type 审批层级走;改 grader 按 §0.3.1 走
`;
  copyToClipboard(txt, '已复制 case 调试 Prompt');
}

// ============================================================
// 入口:页面加载后启动(置于所有函数定义之后,保证引用解析正常)
// ============================================================
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => boot());
} else {
  boot();
}
</script>
