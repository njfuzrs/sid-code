  max_steps: 1
  reference_answer: |
    src/permission/mode.ts 必须导出 PermissionMode 枚举且至少含 default / acceptEdits / dontAsk /
    plan / always-allow / deny-write / dangerously-skip-permissions 七种；
    Daemon 部署在 M2+ 引入时,默认 mode = deny-write（无人值守不容许任意写）。

arch_assertions:
  - type: file_must_exist
    path: src/permission/mode.ts
  - type: file_must_contain
    path: src/permission/mode.ts
    pattern: "PermissionMode"
  - type: file_must_contain
    path: src/permission/mode.ts
    pattern: "deny-write"
  - type: file_must_contain
    path: src/permission/mode.ts
    pattern: "plan"
  - type: file_must_contain
    path: src/permission/mode.ts
    pattern: "acceptEdits"

