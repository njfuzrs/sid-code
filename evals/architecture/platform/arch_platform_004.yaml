    断言：sid-code Permission 模式可按部署形态切换——CLI 模式默认 trust-workdir（开发者本机自己写代码可写）；
    Daemon / 服务化模式必须默认 sandbox / deny-write（无人值守不可任意写）。
    出处：platform_011 / 08 §9.2 P0-tier2。
    **前置能力**：CLI 部分已有（7 种 PermissionMode 全部就位），Daemon 形态待建（≤1sprint）。
  repo: sid-code
  repo_commit: ""

