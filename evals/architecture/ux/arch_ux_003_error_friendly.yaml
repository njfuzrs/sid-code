id: arch_ux_003
category: 架构 UX
priority: P1
created_date: 2026-05-28

eval_type: capability
target_score: 3.5
graduated_at: null
holdout: false
holdout_reason: null

grader_type: structured_arch

input:
  user_query: |
    （本 case 是静态结构断言，不依赖 agent 输出）
    断言（ux_003）：错误信息友好度 ——
    用户错误（如 API key 缺失 / 网络断开 / 工具调用越权 / 文件不存在）应给出：
      (1) 一句话错误说明（中文一等公民）
      (2) 可操作的下一步建议（设置环境变量 / 检查网络 / 检查权限）
      (3) 必要时附 troubleshooting 链接
    不应抛出原始 stack trace 给用户（开发模式除外）。
  repo: sid-code
  repo_commit: ""

expected:
  outcome: user_friendly_error_messages
  max_steps: 1
  reference_answer: |
    src/llm/fallback.ts 含友好错误处理；
    src/permission/checker.ts 拒绝时给出可读原因；
    错误中文显示 + 含建议。

arch_assertions:
  - type: dir_must_exist
    path: src/llm
  - type: dir_must_exist
    path: src/permission

placeholder: false

rubric:
  completeness: "错误友好度 = 说明 + 建议 + 中文"
  precision: "区分用户错误（友好提示）vs 程序 bug（开发模式 stack trace）"
  helpfulness: "新用户能根据错误自己解决"

baseline_scores: {}

