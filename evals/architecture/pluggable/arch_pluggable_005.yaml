      }
  }

source: "B-10 / 08 §9.2 P0-tier2"
notes: |
  B-10 Skill 失败阻断（Security 类）。
  - 与 B-09 配对：review 降级 vs security 阻断
  - OpenClaw 7+ CVE 教训核心：security 失败时不能"先放过去"
