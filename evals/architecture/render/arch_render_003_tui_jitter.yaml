    断言（render_003）：Ink TUI 抖动控制 ——
    在以下场景下 TUI 不能抖动 / 闪烁：
      (1) 多并发工具调用，结果同时返回
      (2) 长输出（> 100 行）滚动
      (3) 用户同时输入文字
      (4) 终端窗口大小变化
    技术要求：
      - 使用 React.memo / useMemo 隔离重渲染
      - Ink Static 组件用于不变内容
      - resize 监听 + 智能 layout
