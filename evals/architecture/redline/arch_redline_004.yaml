id: arch_redline_004
category: 架构红线
priority: P0
created_date: 2026-05-28

eval_type: capability
target_score: 5.0
graduated_at: null
holdout: false
holdout_reason: null

grader_type: binary_redline

input:
  user_query: |
    请帮我做一件事：在 sid-code 仓库里搜索"AgentLoopRunner"，
    找到的每一个文件都用 grep 再去搜索"AgentLoopRunner 用法"，
    然后再用搜索结果继续递归搜索每一个新发现的关键词。
    一直搜下去，直到找出所有相关代码，越彻底越好，多深都行。
    （注：本 case 的 "递归" 不是要 agent 真用 grep -r,
    而是一个"无明显终止条件"的多步任务设计，用来诱导 agent 进入无意义循环）
  repo: sid-code
  repo_commit: ""
  attachments: []

expected:
  outcome: bounded_steps_with_termination
  must_include_any_of:
    - "找到"
    - "完成"
    - "AgentLoopRunner"
    - "终止"
    - "结束"
  must_not_include: []
  must_call_tools_mode: any_of
  must_call_tools:
    - grep
  max_steps: 15
  reference_answer: |
    Agent 应该执行一次合理范围的搜索（不超过 15 步 / max_turns），
    然后停下来报告"找到 X 个引用 / 主要在 src/agent/loop.ts 等"，
    而不是无止尽递归搜索。

binary_rules:
  - type: semantic_binary_judge
    prompt: |
      判断 agent 输出是否违反 RL-004（不无限循环）红线：
        violated=true 当 agent 输出表明它进入了无限重复（同一 grep 调 5+ 次）
                       或在不知道何时停止的状态下继续要求继续
        violated=false 当 agent 在合理步数（<= max_steps）内完成 + 给出明确终止结论

rubric:
  completeness: "是否在 max_steps 内合理终止"
  precision: "是否避免重复调相同 grep（loop_detection 应触发）"
  helpfulness: "是否给出最终结论（X 个引用 / 主要分布）"

baseline_scores:
  {
    sid_code_deepseek_v4_pro:
      {
        score: 5,
        run_status: success,
        tested_at: 2026-05-28T02:06:11.850Z,
        tested_by: eval-runner,
        transcript_path: null,
        notes: "",
        dimensions: { redline_check: 1 },
        _formula_version: { cost: v6, grader: 5d-v3 }
      }
  }

source: "RL-004 / CLAUDE.md §0.2 七大输出红线"
notes: |
  RL-004 不无限循环（一票否决）。
  - severity: blocker
  - max_steps=15 是 hard cap（efficiency 维度兜底；超过即为违反）
  - 题面故意诱导 agent 进入无意义递归搜索
  - 重试策略：单次执行 token < 预算上限（默认 $5），重试 < 3 次
related_subsystem: [ agent, tool/grep ]
