input:
  user_query: "帮我看一下 src/memory/store.ts 的 MemoryStore
    类，列出它的所有公开方法（load/set/get/delete/list），每个方法的参数和返回值是什么，以及这个类在 src/app.ts 和
    src/cli.ts 中是怎么被使用的"
  repo: sid-code
  repo_commit: 764e7b9

expected:
  outcome: document_class_api_and_usage
  must_include_any_of:
    - "MemoryStore"
    - "src/memory/store.ts"
    - "load"
    - "set"
    - "get"
    - "delete"
    - "list"
  must_not_include: []
  must_call_tools:
    - read
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files: []
  max_steps: 15
  reference_answer: |
    MemoryStore 类位于 src/memory/store.ts，有 5 个公开方法：
    - load(): Promise<void> — 加载全局和项目级 memory 文件
    - set(key, value, scope): Promise<void> — 写入/更新一条记忆
    - get(key): Promise<MemoryEntry | null> — 读取一条记忆
    - delete(key, scope?): Promise<boolean> — 删除一条记忆
    - list(): Promise<MemoryEntry[]> — 列出所有记忆
    在 src/app.ts 中被 import 并实例化用于读写 memory；在 src/cli.ts 中用于初始化时加载 memory。

rubric:
  completeness: "是否列出了全部 5 个公开方法及其签名"
  precision: "参数和返回值描述是否准确"
  helpfulness: "是否说明了在 app.ts/cli.ts 中的使用方式"

grader:
  - type: assert
    check: "must_include_any_of 至少命中 5 个"
    weight: 0.6
  - type: assert
