eval_type: capability
target_score: 4.0
graduated_at: null
holdout: false
holdout_reason: null

input:
  user_query: "sid-code 的主 agent 循环（agentic while-loop）入口在哪个文件里？类名是什么？请定位并简要解释这个类的核心职责。"
  repo: sid-code
  repo_commit: b27b546
  attachments: []

expected:
  outcome: locate_main_agent_loop_class

  must_include_any_of:
    - "src/agent/loop.ts"
    - "AgentLoopRunner"
    - "agent/loop"
    - "loop.ts"
    - "agentic while"
    - "agentic loop"

  must_not_include: []

  must_call_tools:
    - grep
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
  max_steps: 12

  reference_answer: |
    主 agent 循环入口在 src/agent/loop.ts，导出类 AgentLoopRunner（第 82 行）。
    职责：接收用户输入 → 调用 LLM 流式响应 → 当 stop_reason 为 tool_use 时执行工具
    并继续循环；end_turn 时结束本轮。是 agentic while-loop 架构的"主"循环（区别于
    src/query/loop.ts 的 sub-loop）。

rubric:
  completeness: "是否同时定位到文件路径 + 类名"
  precision: "是否避免将 src/query/loop.ts（sub-loop）作为主入口答案；如果提到 src/query/loop.ts
    是作为对比或区分说明（例如'主循环是 agent/loop.ts，而非 query/loop.ts'），不应扣分；只有将其当作主入口才算错误"
  helpfulness: "是否解释了主循环 vs sub-loop 区别 / agentic while-loop 关键点"

grader:
  - type: assert
    check: "must_include_any_of 至少命中 1 个"
    weight: 1.0

