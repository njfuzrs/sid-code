input:
  user_query: "src/context/manager.ts 里有个 getCompactionLevel 方法，它根据什么条件决定压缩级别？如果
    toolCount 为 0 时会返回什么级别？帮我分析一下这个方法的边界行为"
  repo: sid-code
  repo_commit: 764e7b9

expected:
  outcome: analyze_compaction_level_boundary
  must_include_any_of:
    - "CompactionLevel"
    - "getCompactionLevel"
    - "src/context/manager.ts"
  must_not_include:
    - "已修复"
    - "我帮你修"
    - "已修改 manager.ts"
    - "我猜"
    - "大概是"
    - "应该返回"
  must_call_tools:
    - read
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files: []
  max_steps: 12
  reference_answer: |
    getCompactionLevel 方法根据 toolCount 参数决定压缩级别。
    当 toolCount 为 0 时，返回最低压缩级别（不压缩或轻量压缩）。
    边界行为：toolCount 越大，压缩越激进。

rubric:
  completeness: "是否准确描述了 getCompactionLevel 的判断逻辑"
  precision: "是否正确回答了 toolCount=0 时的返回值"
  helpfulness: "是否分析了边界条件和各级别的触发阈值"

