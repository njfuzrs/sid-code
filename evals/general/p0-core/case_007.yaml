  repo_commit: b27b546
  attachments: []

expected:
  outcome: analyze_quota_boundary

  must_include_any_of:
    - "src/llm/quota.ts"
    - "QuotaManager"
    - "QuotaCheckResult"
    - "AlertLevel"
    - "quota"
    - "check("
    - "ratio"
    - ">="
    - "exceeded"
    - "1.0"

  must_not_include:
    - "我猜"
    - "大概是"
    - "可能返回"
    - "应该返回"
    - "已修复"
    - "已修改 quota.ts"
    - "我帮你修"

  must_call_tools:
    - read
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
  max_steps: 10

  reference_answer: |
    QuotaManager 在 src/llm/quota.ts:23，check(currentCost) 在第 79 行。边界行为应
    通过读源码确定（不要凭猜）。期望答案给出：
    - 阈值相等时返回的 AlertLevel（"warning" | "critical" | "exceeded" | null）
    - 决定该行为的具体行号
    - 是否存在浮点比较风险（== vs >=）

rubric:
  completeness: "明确给出边界行为 + 具体行号"
  precision: "不要凭直觉猜，必须用 Read 读源码"
  helpfulness: "指出潜在的浮点比较坑或建议加测试"

