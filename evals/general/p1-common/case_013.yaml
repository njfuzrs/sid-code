input:
  user_query: "我想给 src/llm/provider.ts 的 Provider 接口加一个新的可选字段 displayName?:
    string。涉及哪些 Provider 实现需要更新？请帮我列出来,但先不要动手。"
  repo: sid-code
  repo_commit: b27b546
  attachments: []

expected:
  outcome: list_provider_implementations

  must_include_any_of:
    - "src/llm/provider.ts"
    - "src/llm/anthropic.ts"
    - "src/llm/openai.ts"
    - "src/llm/ollama.ts"
    - "Provider"

  must_not_include: []

  must_call_tools:
    - grep
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
  max_steps: 10

  reference_answer: |
    Provider 接口在 src/llm/provider.ts:18。三个实现：
    - src/llm/anthropic.ts
    - src/llm/openai.ts
    - src/llm/ollama.ts（继承自 openai 客户端）
    新增可选字段不强制 break 现有实现，但建议三个客户端都补 displayName 提升 UX。
    不修改任何文件。

rubric:
  completeness: "三个 Provider 实现全部列出"
  precision: "不要漏掉 ollama"
  helpfulness: "指出可选字段不破坏向后兼容"

