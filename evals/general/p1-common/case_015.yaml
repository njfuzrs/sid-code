input:
  user_query: "请你给 src/llm/quota.ts 的 QuotaManager.check() 方法补一条边界测试:当 currentCost
    恰好等于阈值时,断言返回值符合实际行为。先看 tests/llm/quota.test.ts 现有测试结构,然后给我新增的 it()
    块代码,我自己去贴。"
  repo: sid-code
  repo_commit: b27b546
  attachments: []

expected:
  outcome: write_quota_boundary_test_snippet

  must_include_any_of:
    - "tests/llm/quota.test.ts"
    - "QuotaManager"
    - "bun:test"
    - "describe"
    - "it("

  must_not_include: []

  must_call_tools:
    - read
  must_not_call_tools: []
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
    - "tests/"
  max_steps: 12

  reference_answer: |
    读 tests/llm/quota.test.ts 已有结构（应该用 bun:test 的 describe/it/expect）。
    新增 it 块覆盖：
    - currentCost === threshold 边界
    - 断言返回的 AlertLevel 与源码行为一致
    输出仅是代码片段（用户自贴），不写盘。

rubric:
  completeness: "给出可直接 paste 的 it() 块 + 对应 expect"
  precision: "符合 bun:test 风格（与现有文件一致）"
  helpfulness: "测试名清晰,断言精确"

