# 穷人版合并队列：每次只给队首一个挂了 auto-merge 的 BEHIND PR 做 update-branch（2026-11-03）
#
# 为什么需要：ruleset 开了 strict，个人账户仓库开不了 merge queue（422）。每合入一个 PR
# 其余全部 BEHIND，而 auto-merge 不会自己 update-branch —— 实测一天 15 个 PR，
# 大头浪费是「BEHIND 挂着等人点按钮」。判定逻辑与理由见 scripts/pr-auto-update.ts 文件头。
#
# ⚠️ 必须用 PAT，不能用 GITHUB_TOKEN：GITHUB_TOKEN 触发的 update-branch 产生的
# pull_request synchronize 事件，CI run 会进入「需要人批准」状态（GitHub 防递归机制），
# 队列照样卡在等人点按钮，等于什么都没省。
# secret `PR_AUTO_UPDATE_TOKEN`：fine-grained PAT，只授权本仓库，
# Contents + Pull requests + Workflows 三项 Read and write。缺了它本 workflow 直接报红，
# 不静默跳过（静默跳过 = 队列看起来在工作，其实一个都没推）。
# Workflows 不能省：update-branch 是把 main 合进 PR 分支，main 上只要动过 .github/workflows/，
# 没有 workflows 权限的令牌推这个 merge 会被 GitHub 拒绝。
#
# ⚠️ secret 放在 **Environment `pr-auto-update`** 里，不放仓库级（2026-11-03）：
# 同仓分支触发的 workflow 能读仓库级 secret，任何 write 协作者推一个分支、写一个打印
# secret 的 workflow 就能拿走这个 PAT（之后以 owner 身份操作，移出协作者后仍有效）。
# Environment 配「Deployment branches = Selected branches: main」后，只有 main 上跑的
# job 能读到它。本 workflow 的触发（push main / schedule / workflow_run / dispatch）
# 都跑在 main 上，不受影响。`deployment: false` 让它不往部署历史里写记录。
#
# ⚠️ 安全边界：PAT 有写权限，所以本 workflow **只 checkout main 上的代码、只跑 main 上的脚本**，
# 绝不 checkout PR 分支（workflow_run 事件的 head 可能是 PR 分支，这里刻意写死 ref: main）。
# 脚本本身只调 `gh pr list` 与 `gh pr update-branch`，不合并、不改 PR 内容。

name: PR auto update

on:
  # PR 合入 main → 队首换人
  push:
    branches: [main]
  # 在飞的 PR CI 跑完（尤其是红了）→ 让出槽位给下一个
  workflow_run:
    workflows: [CI]
    types: [completed]
  # 兜底：上面两个事件都漏了（比如 UNKNOWN 连续算不出被本轮放弃）时，15 分钟内自愈
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# GITHUB_TOKEN 只读：写操作全部走 PAT，权限边界在 PAT 的授权范围里，不在这里扩
permissions:
  contents: read

# 全局串行：同一时刻只有一个实例在判「谁是队首」，否则两个实例可能各 update 一个，
# 串行被打破。不取消在跑的实例：它可能已经发出 update-branch，取消只会丢日志。
concurrency:
  group: pr-auto-update
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: pr-auto-update
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # bun 版本与 ci.yml 同源：读 `.bun-version`，禁止 latest
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # 脚本零依赖（只用 bun 内置 + gh），不需要 bun install
      - name: 更新队首 PR
        env:
          GH_TOKEN: ${{ secrets.PR_AUTO_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::缺少 secret PR_AUTO_UPDATE_TOKEN（应放在 Environment pr-auto-update 里，且该 Environment 只允许 main；见本文件头注释）"
            exit 1
          fi
          bun run scripts/pr-auto-update.ts
