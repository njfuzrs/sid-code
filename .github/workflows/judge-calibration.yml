# Monthly Judge Calibration (T-18 §6.4)
#
# 触发：每月 1 号 UTC 02:00（北京时间月初 10:00）；可手动触发。
# 设计：跑 T-13 pairwise calibration，输出本月 judge accuracy / position bias 指标。
#       Cohen's κ 下降 > 0.05 自动告警（说明 judge model 升级 / drift）。
#
# 数据归档：evals/_judge/calibration-set/summary-{YYYY-MM}.md
# 业界对应：Future AGI 2026 推荐做法——calibration drift 是 5 大已知偏置之一。

name: Monthly Judge Calibration

on:
  # ⚠️ cron 已停用（2026-08-13）：依赖 ANTHROPIC_API_KEY，而首发时该 secret 未配置。
  # 理由与恢复方式同 eval-weekly.yml 同位注释。
  # schedule:
  #   # 每月 1 号 UTC 02:00（北京时间 10:00）
  #   - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      judge:
        description: "Judge model (default: claude-sonnet-4-5-20250929)"
        default: "claude-sonnet-4-5-20250929"
        required: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # fork 里不跑 cron：fork 继承 cron 但拿不到 secrets，否则每月 1 号给每个 fork
    # 发一封无从修复的失败邮件。后半段保留 workflow_dispatch 手动触发。
    # 判据选型与 fail-open 取舍见 eval-weekly.yml 同位注释。
    if: ${{ github.event.repository.fork == false || github.event_name != 'schedule' }}

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run pairwise calibration
        run: |
          JUDGE="${{ github.event.inputs.judge || 'claude-sonnet-4-5-20250929' }}"
          bun run scripts/eval/calibrate-pairwise.ts --judge "$JUDGE"

      - name: Commit calibration report
        run: |
          git config user.name "judge-calibration-bot"
          git config user.email "judge-calibration-bot@users.noreply.github.com"
          git add evals/_judge/calibration-set/
          if git diff --cached --quiet; then
            echo "no calibration results to commit"
          else
            git commit -m "ci(judge): monthly calibration $(date -u +%Y-%m)"
            git push
          fi

      - name: Upload calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-calibration-${{ github.run_id }}
          path: evals/_judge/calibration-set/
