# CI 门禁：全量单测 + 构建 + lint（2026-08-01 补齐，2026-08-10 补多平台矩阵、eval-framework 兜底与 lint 门禁）
#
# 为什么需要：在此之前仓库有 5 个 workflow，但**没有一个跑全量 bun test**
#   · docs-lint.yml            只在 docs/ 改动时跑文档规则（现已删除）
#   · provider-daily-canary.yml 定时任务，且只跑 packages/core/tests/llm/vcr/ 子集
#   · eval-pr-smoke.yml         只跑 5 个 P0 eval case
#   · eval-weekly.yml / judge-calibration.yml  定时的评估任务
# 于是 PR 阶段测试完全不设防，问题一路憋到 `./scripts/release.sh` 的发布前门禁才炸。
# 那是最糟的暴露时机：门禁在 bump-version **之后**（版本号已经 +1），且此时人已经在
# 发布流程中间，压力最大、最容易顺手加 --skip-test 绕过。
#
# 把同一道关卡前移到 PR：让失败发生在写代码的时候，而不是发版的时候。
#
# 刻意**不含**类型检查（`tsc --noEmit`）：当前有 187 个存量错误（P1-3），接了就是永久红灯。
# 清零后再在这里加一个 step，别另开 workflow。
#
# lint 门禁（P1-4，2026-08-10 接入）见下方独立的 `lint` job —— `.oxlintrc.json` 只开
# correctness 档、关掉 style/pedantic 等风格类噪音，接入前已把存量 61 处 no-unused-vars
# 清零，理由与逐条豁免规则见 `.oxlintrc.json` 顶部注释，不在这里重复。
#
# ⚠️ 本文件在 2026-08-12 迁到 GitHub 之前**从未真正在 CI 上跑过**（那时 remote 是
# 内网 GitLab，不读 .github/workflows/），它是为开源切换预置的。首发后的前几次 run
# 请以实际结果为准复核本文件的假设 —— 预置配置没跑过就等于没验证过。

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# 同一分支的旧 run 自动取消，避免连续 push 时排队浪费 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 多平台矩阵：三家对标项目（codex / opencode / gemini-cli）都至少覆盖 ubuntu + macOS。
    # 内嵌 rg 这两个平台都已入库（packages/core/vendor/ripgrep/15.1.0/rg-linux-x64 与 rg-darwin-arm64），
    # 所以 make build 的 fetch-ripgrep 步骤不需要联网。
    # Windows 未纳入：见 docs/bugfixes/todo/高级能力/Windows系统兼容性能力补齐/
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不掩盖另一个平台的结果——平台相关的 bug 正是矩阵要抓的东西
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    # 本地全量约 200s（9177 test / 649 文件）；给足余量覆盖 CI 冷启动与依赖安装
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ⚠️ 这一步能成功的前提是 `packages/eval-framework/` 已入库。
      # 它曾是 `file:../eval-framework` 仓库外依赖（P1-5），那时 fresh clone 上
      # `bun install --frozen-lockfile` 直接 EXIT=1（`ENOENT: ... package eval-framework`），
      # ci.yml 第一步就断、根本走不到 bun test。2026-08-10 已 vendor 成 Bun workspace
      # （`"eval-framework": "workspace:*"`），实测 fresh clone EXIT=0 / 222 包。
      # 若哪天这步又报 eval-framework 找不到，先确认 packages/ 是否还在版本控制里。
      - name: Install deps
        run: bun install --frozen-lockfile

      # 与 release.sh 发布前门禁同源（同一条 `bun test`），前移到 PR 阶段。
      # 不做任何文件排除：5 个依赖 eval-framework 的测试文件
      # （tests/eval/ 下 agent-trace / raw-jsonl-to-trace / baseline-sync-holdout /
      # eval-runner-e2e，加间接经 evals/providers/sid-code-live.ts 的
      # eval-runner-trajectory-meta）在 vendor 成 workspace 后已能正常解析。
      - name: 全量单测
        run: bun test

      # 测试不得改动被 git 追踪的文件。这不是洁癖：`evals/holdout/real-tasks/holdout-sids.txt`
      # 是「永封」文件，实测被测试写脏过（残留 fixture 字面量 `tampered-extra-line`，
      # 来自 tests/eval/check-holdout-real-tasks-sealed.test.ts 的 withSealedBackup 未能恢复），
      # 而 pre-push hook 会拿 sha256 校验它 —— 脏了就推不上去，且脏数据会被误当真实数据提交。
      # 同类事故已有前科（2026-08-03 遥测落盘污染，见 CLAUDE.md「测试约定」）。
      # 放在测试**之后**跑，才能抓到测试自己的副作用。
      #
      # 只看**已追踪**文件（--porcelain 的前两列非 `??`）：测试产生的临时文件属于
      # untracked，不该让 CI 变红 —— 那会把这道门禁变成噪音源，最后被人加 `|| true` 绕过。
      - name: 单测未污染工作区
        run: |
          dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "$dirty" ]; then
            echo "::error::单测改动了被 git 追踪的文件（测试缺少落盘隔离，见 CLAUDE.md「测试约定」）"
            echo "$dirty"
            git diff --stat
            exit 1
          fi
          echo "✅ 已追踪文件无改动，单测无落盘副作用"

      # make build 不动版本号，CI 里跑它不会让 package.json 变脏。
      # 末尾的 ./sid-code --self-check 会断言关键修复已内联 + 内置 skill 已嵌入
      # + 内嵌 rg 平台匹配，等于顺带验证了构建产物可用。
      - name: 构建 + 产物自检
        run: make build

  # lint 门禁独立成 job：oxlint 65ms 跑完全仓，没必要占矩阵里两个平台的 slot，
  # 也不该被 9000+ 单测的时长拖着一起等。规则集与豁免理由见 .oxlintrc.json。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: oxlint
        run: bun run lint

      # P2-1：格式门禁。与 oxlint 同 job（都是几百毫秒的静态检查，见下方同款理由）。
      #
      # 为什么服务端也要有：pre-commit 装在本地且能被 --no-verify 跳过，而 formatter
      # 的全部价值在于「所有人的 diff 里没有排版噪音」——只要有一个人绕过去，
      # 后面每个碰到那个文件的人都会带上一次无关的重排。外部贡献者的编辑器配置更杂，
      # 这道检查是让「格式统一」这件事不依赖任何人的本地设置。
      - name: oxfmt
        run: bun run format:check

      # P2-2 步骤6：包边界（shared(0) < tui-renderer(1) < core(2) < cli(3)）。
      # 与 lint 同 job：都是几百毫秒的静态检查，没必要各起一次 checkout + bun install。
      #
      # 为什么不只依赖 pre-commit：hook 装在本地、可被 --no-verify 跳过，
      # 而这条不变量（core 不知道 TUI 存在）是 core 能当库用的前提，得有一道跑在服务端、
      # 绕不过去的检查。tests/build/package-boundary.test.ts 里还有一份带防假绿用例的版本，
      # 两者共用同一个扫描器，职责不同：这里给出快速失败，那里守扫描器自身不空转。
      - name: 包边界扫描
        run: bun run lint:boundary

  # 面向用户的文档门禁不在这里：那部分在 website/，由 pre-commit 的
  # `docs-gen-reference.ts --check` 与 pre-push 的站点构建（死链检查）守着。
