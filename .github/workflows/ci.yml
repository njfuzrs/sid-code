# CI 门禁：全量单测 + 构建 + lint（2026-08-01 补齐，2026-08-10 补多平台矩阵、eval-framework 兜底与 lint 门禁）
#
# 为什么需要：在此之前仓库有 5 个 workflow，但**没有一个跑全量 bun test**
#   · docs-lint.yml            只在 docs/ 改动时跑文档规则（现已删除）
#   · provider-daily-canary.yml 定时任务，且只跑 packages/core/tests/llm/vcr/ 子集
#   · eval-pr-smoke.yml         只跑 5 个 P0 eval case
#   · eval-weekly.yml / judge-calibration.yml  定时的评估任务
# 于是 PR 阶段测试完全不设防，问题一路憋到 `./scripts/release.sh` 的发布前门禁才炸。
# 那是最糟的暴露时机：门禁在 bump-version **之后**（版本号已经 +1），且此时人已经在
# 发布流程中间，压力最大、最容易顺手加 --skip-test 绕过。
#
# 把同一道关卡前移到 PR：让失败发生在写代码的时候，而不是发版的时候。
#
# 刻意**不含**类型检查（`tsc --noEmit`）：当前有 187 个存量错误（P1-3），接了就是永久红灯。
# 清零后再在这里加一个 step，别另开 workflow。
#
# lint 门禁（P1-4，2026-08-10 接入）见下方独立的 `lint` job —— `.oxlintrc.json` 只开
# correctness 档、关掉 style/pedantic 等风格类噪音，接入前已把存量 61 处 no-unused-vars
# 清零，理由与逐条豁免规则见 `.oxlintrc.json` 顶部注释，不在这里重复。
#
# ⚠️ 本文件在 2026-08-12 迁到 GitHub 之前**从未真正在 CI 上跑过**（那时 remote 是
# 内网 GitLab，不读 .github/workflows/），它是为开源切换预置的。首发后的前几次 run
# 请以实际结果为准复核本文件的假设 —— 预置配置没跑过就等于没验证过。

name: CI

on:
  pull_request:
    branches: [main]
    # ⚠️ `edited` 不是可选项，缺了它 stacked PR 会**永久卡死**（2026-08-15 实测于 PR #31）。
    #
    # 复发路径：PR B 的 base 先指向 PR A 的分支（stacked），此时 `branches: [main]`
    # 把 B 的 pull_request 事件整个滤掉 —— CI 一次都不跑。等 A 合入 main，GitHub 自动把
    # B 的 base 改成 main（timeline 里的 `automatic_base_change_succeeded`），发出的却是
    # `edited` action。而 types 的默认值是 `[opened, synchronize, reopened]`，**不含
    # `edited`** —— 于是 base 已经合规了，CI 依然不跑，而且此后再没有任何事件能触发它。
    #
    # 后果不是「少跑一次」而是「永久 BLOCKED」：ruleset protect-main 要求
    # test (ubuntu-latest) / test (macos-latest) / lint 三个检查，它们全部由本文件产出。
    # 一个 run 都没有 → 三个检查恒为 pending（PR 页面显示 "Waiting for status to be
    # reported"）→ 只能靠人手动 close/reopen 才能解开。**这个失败模式没有红叉，
    # 只有一个永远转不完的圈**，比直接失败更难归因。
    #
    # 代价是改标题/正文这类纯文本编辑也会触发一次 CI。这个代价是刻意接受的：
    # 一次多余的 run 是几分钟 runner 时间，而一个卡死的 PR 要靠人发现 + 人干预。
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # 合并队列。队列把「各自绿、合起来红」这一类失败挪到合并**之前**：
  # 两个 PR 各自对着自己的 base 绿了，不代表合到一起还绿（git 无冲突但语义冲突）。
  # 并行开发时这类失败是必然而非偶发，而它在 PR 级门禁里**测不到**——PR 的 CI 跑的是
  # 「我的分支」，不是「我合进 main 之后的 main」。队列会为每个待合 PR 造一个临时的
  # merge_group ref（含前面所有排队项），在那上面跑本文件，绿了才真合。
  #
  # ⚠️ **本仓目前开不了队列，这个 trigger 是预置的**（2026-08-19 实测）：
  # GitHub 限制「仅**组织拥有**的公共仓库，或用 Enterprise Cloud 的组织的私有仓库」，
  # 本仓 owner 是个人账户 → 往 ruleset 加 merge_queue 规则返回
  # `422 Invalid rule 'merge_queue'`。所以 merge_group 事件**永远不会发生**，
  # 这一行现在是零成本的空转（GitHub 不发的事件不会消耗 runner）。
  #
  # 留着它的理由：哪天仓库转到组织下，开队列只需要在 ruleset 加一条规则，
  # 不用再改本文件——而漏改本文件的后果是队列跑不出任何检查、PR 永远排在队里。
  #
  # 现在替代它的是 ruleset 的 strict 必需检查策略（分支必须与 main 最新才能合并）。
  # ⚠️ strict **不等价于**队列：它保证「CI 跑的是最新的 main + 我的改动」，
  # 但两个 PR 同时通过 strict 检查后先后合入时，后者的 CI 结论仍然是合并前的。
  # 所以语义冲突在本仓**没有合并前的机制对策**，只能靠合并后在 main 上跑一次门禁。
  merge_group:

# 同一分支的旧 run 自动取消，避免连续 push 时排队浪费 runner。
#
# ⚠️ merge_group 的 run **不能被取消**（抄 gemini-cli）：它是「合并后状态」的唯一验证结论，
# 取消掉队列就拿不到判据，只能把 PR 踢出队列——表现为莫名其妙的「入队又被弹出」。
# 而 PR 分支的 run 取消掉无所谓，下一次 push 会重跑。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  test:
    # 多平台矩阵：三家对标项目（codex / opencode / gemini-cli）都至少覆盖 ubuntu + macOS。
    # 内嵌 rg 这两个平台都已入库（packages/core/vendor/ripgrep/15.1.0/rg-linux-x64 与 rg-darwin-arm64），
    # 所以 make build 的 fetch-ripgrep 步骤不需要联网。
    # Windows 未纳入：见 docs/bugfixes/todo/高级能力/Windows系统兼容性能力补齐/
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不掩盖另一个平台的结果——平台相关的 bug 正是矩阵要抓的东西
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    # 本地全量约 200s（9177 test / 649 文件）；给足余量覆盖 CI 冷启动与依赖安装
    timeout-minutes: 25

    steps:
      # ⚠️ fetch-depth: 0 不是「顺手要全量」：tests/website/changelog-integration.test.ts
      # 的两条断言要用 `git tag` 算版本区间的真实提交数，而 checkout 默认 depth=1 且不取
      # tag —— 区间恒为空，`toBeGreaterThan(0)` 必失败。2026-08-12 首次真跑 CI 时实测到。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ⚠️ runner 默认**不带 ripgrep**，而 GrepTool / hasRipgrep / ripGrep 这些测试调的是
      # PATH 上的系统 `rg`（不是编译产物里内嵌的那份）。不装就是
      # `Executable not found in $PATH: "rg"`，这是 2026-08-12 首次真跑 CI 才暴露的。
      #
      # 2026-08-19 从「联网装」改成「把仓内 vendor 产物挂上 PATH」，起因是一次实测事故：
      # `sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep` 在 ubuntu runner 上
      # 挂死 25 分 12 秒，直接撞爆 job 的 timeout-minutes: 25（PR #66，run 32229207101）。
      # 后果不是「装 rg 慢了」而是**全量单测一次都没跑到**，PR 上显示的是一个 canceled，
      # 归因还得回日志一行行看时间戳；`-qq` 又把输出静音了，连挂在哪句都看不出来。
      # 同一 run 的 macOS 腿正常（brew 装到 15.2.0），前三次 run 的 ubuntu 腿也都 ~160s，
      # 所以它是 runner 侧的网络/apt 锁 flake —— 而 flake 的修法不是重跑，是把网络依赖拿掉。
      #
      # 仓内已提交 4 平台预编译 rg（packages/core/vendor/ripgrep/<version>/rg-<platform>，
      # linux-x64 那份是 static-pie、无动态库依赖），随 clone 直接可用。所以这步现在是
      # 纯本地 copy + chmod：离线、确定性、亚秒级，且两条矩阵腿跑的是**同一个 rg 版本**
      # —— 以前一边是 apt 的、一边是 brew 的，版本相关的失败只会在单腿上冒出来。
      #
      # 版本号走 `--print-version`（与 release.sh:145 同一个取数口径），不在这里硬编码，
      # 否则 DEFAULT_RG_VERSION 一 bump 这里就静默指向不存在的目录。
      #
      # 找不到产物时**硬失败、不回落到包管理器**：回落等于把刚拿掉的挂死风险又请回来，
      # 而这里的失败恰恰是「vendor 少提交了一个平台」这种该当场看见的事（同 CLAUDE.md
      # 「bun install 失败必须 hard-stop 而不是降级」——降级的后果是一个看起来绿的假成功）。
      - name: 挂载仓内 ripgrep 到 PATH（测试按 PATH 调系统 rg）
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun run scripts/fetch-ripgrep.ts --print-version)"
          os="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          [ "$os" = "macos" ] && os="darwin"
          arch="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          src="packages/core/vendor/ripgrep/${version}/rg-${os}-${arch}"

          if [ ! -f "$src" ]; then
            echo "::error::仓内缺少 $src（runner=$RUNNER_OS/$RUNNER_ARCH，version=$version）"
            echo "::error::补齐方式：bun run scripts/fetch-ripgrep.ts --all 后 git add packages/core/vendor/ripgrep/${version}/"
            ls -la "packages/core/vendor/ripgrep/${version}/" 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/rg-bin"
          cp "$src" "$RUNNER_TEMP/rg-bin/rg"
          chmod +x "$RUNNER_TEMP/rg-bin/rg"
          echo "$RUNNER_TEMP/rg-bin" >> "$GITHUB_PATH"
          # 当步的 PATH 还没生效，这里直接按绝对路径自证产物可执行（跨平台产物错配会在此暴露）
          "$RUNNER_TEMP/rg-bin/rg" --version | head -1

      # ⚠️ 这一步能成功的前提是 `packages/eval-framework/` 已入库。
      # 它曾是 `file:../eval-framework` 仓库外依赖（P1-5），那时 fresh clone 上
      # `bun install --frozen-lockfile` 直接 EXIT=1（`ENOENT: ... package eval-framework`），
      # ci.yml 第一步就断、根本走不到 bun test。2026-08-10 已 vendor 成 Bun workspace
      # （`"eval-framework": "workspace:*"`），实测 fresh clone EXIT=0 / 222 包。
      # 若哪天这步又报 eval-framework 找不到，先确认 packages/ 是否还在版本控制里。
      - name: Install deps
        run: bun install --frozen-lockfile

      # ⚠️ 这里刻意用裸 `bun test`（**不是** `bun run test`）。
      # `package.json` 的 `test` 脚本带 `--test-name-pattern '^(?!.*\[slow\])'`，是给
      # 本地开发用的快通道（跳过 4 条标 [slow] 的真实时钟 case）；CI 必须跑**全部**，
      # 否则那 4 条就成了没有任何门禁的死测试 —— 正是本仓「建好未接线」那类病灶。
      # 需要单独跑那 4 条时用 `bun run test:slow`；`bun run test:all` 等价于本行。
      #
      # 与 release.sh 发布前门禁同源（同一条 `bun test`），前移到 PR 阶段。
      # 不做任何文件排除：5 个依赖 eval-framework 的测试文件
      # （tests/eval/ 下 agent-trace / raw-jsonl-to-trace / baseline-sync-holdout /
      # eval-runner-e2e，加间接经 evals/providers/sid-code-live.ts 的
      # eval-runner-trajectory-meta）在 vendor 成 workspace 后已能正常解析。
      - name: 全量单测
        run: bun test

      # 测试不得改动被 git 追踪的文件。这不是洁癖：`evals/holdout/real-tasks/holdout-sids.txt`
      # 是「永封」文件，实测被测试写脏过（残留 fixture 字面量 `tampered-extra-line`，
      # 来自 tests/eval/check-holdout-real-tasks-sealed.test.ts 的 withSealedBackup 未能恢复），
      # 而 pre-push hook 会拿 sha256 校验它 —— 脏了就推不上去，且脏数据会被误当真实数据提交。
      # 同类事故已有前科（2026-08-03 遥测落盘污染，见 CLAUDE.md「测试约定」）。
      # 放在测试**之后**跑，才能抓到测试自己的副作用。
      #
      # 只看**已追踪**文件（--porcelain 的前两列非 `??`）：测试产生的临时文件属于
      # untracked，不该让 CI 变红 —— 那会把这道门禁变成噪音源，最后被人加 `|| true` 绕过。
      - name: 单测未污染工作区
        run: |
          dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "$dirty" ]; then
            echo "::error::单测改动了被 git 追踪的文件（测试缺少落盘隔离，见 CLAUDE.md「测试约定」）"
            echo "$dirty"
            git diff --stat
            exit 1
          fi
          echo "✅ 已追踪文件无改动，单测无落盘副作用"

      # make build 不动版本号，CI 里跑它不会让 package.json 变脏。
      # 末尾的 ./sid-code --self-check 会断言关键修复已内联 + 内置 skill 已嵌入
      # + 内嵌 rg 平台匹配，等于顺带验证了构建产物可用。
      - name: 构建 + 产物自检
        run: make build

  # lint 门禁独立成 job：oxlint 65ms 跑完全仓，没必要占矩阵里两个平台的 slot，
  # 也不该被 9000+ 单测的时长拖着一起等。规则集与豁免理由见 .oxlintrc.json。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: oxlint
        run: bun run lint

      # P2-1：格式门禁。与 oxlint 同 job（都是几百毫秒的静态检查，见下方同款理由）。
      #
      # 为什么服务端也要有：pre-commit 装在本地且能被 --no-verify 跳过，而 formatter
      # 的全部价值在于「所有人的 diff 里没有排版噪音」——只要有一个人绕过去，
      # 后面每个碰到那个文件的人都会带上一次无关的重排。外部贡献者的编辑器配置更杂，
      # 这道检查是让「格式统一」这件事不依赖任何人的本地设置。
      - name: oxfmt
        run: bun run format:check

      # P2-2 步骤6：包边界（shared(0) < tui-renderer(1) < core(2) < cli(3)）。
      # 与 lint 同 job：都是几百毫秒的静态检查，没必要各起一次 checkout + bun install。
      #
      # 为什么不只依赖 pre-commit：hook 装在本地、可被 --no-verify 跳过，
      # 而这条不变量（core 不知道 TUI 存在）是 core 能当库用的前提，得有一道跑在服务端、
      # 绕不过去的检查。tests/build/package-boundary.test.ts 里还有一份带防假绿用例的版本，
      # 两者共用同一个扫描器，职责不同：这里给出快速失败，那里守扫描器自身不空转。
      - name: 包边界扫描
        run: bun run lint:boundary

  # ── 汇聚门（2026-08-19 接入，抄 langfuse pipeline.yml 的 all-checks-passed）──────────
  #
  # 它自己不跑任何检查，只把上面所有 job 的结论收成**一个**必需检查。
  #
  # 为什么需要这一层间接：ruleset protect-main 原先把 `test (ubuntu-latest)` /
  # `test (macos-latest)` / `lint` 三个**具体 job 名**绑成必需检查，于是分支保护与
  # workflow 的内部结构耦合在一起。已经因此踩过两个坑，且两个都是「不报红只转圈」的形态：
  #   · 改默认分支名 master→main：workflow 的 branches 没跟着改 → CI 不触发而 PR 显绿
  #   · stacked PR 改 base：发 edited 事件不在 types 默认值里 → 三个检查恒 pending
  # 换成一个汇聚 job 之后，job 的增删改名再也不需要动 ruleset —— 只改下面这行 needs。
  #
  # ⚠️ `if: always()` 不可省：默认的隐式 success() 会让上游失败时本 job 直接 skipped，
  # 而 GitHub 把 skipped 的必需检查算作**通过**——那正好是最危险的假绿。
  # 必须无条件运行，然后自己判 needs 的结果。
  #
  # ⚠️ 判据用「不含 failure/cancelled」而不是「全部 == success」：skipped 也要算通过，
  # 否则将来任何一个带 if 条件的 job 被跳过都会把整道门禁卡死。
  all-checks-passed:
    # 加 job 只改这一行，不动分支保护
    needs: [test, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        run: |
          echo "test=${{ needs.test.result }}  lint=${{ needs.lint.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::上游 job 有失败或被取消，拒绝放行"
            exit 1
          fi
          echo "✅ 全部检查通过"

  # 面向用户的文档门禁不在这里：那部分在 website/，由 pre-commit 的
  # `docs-gen-reference.ts --check` 与 pre-push 的站点构建（死链检查）守着。
