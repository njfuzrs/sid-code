# PR Smoke Test (T-17 §6.4)
#
# 触发：每次 PR 推送，跑 5 条 P0 smoke case 守护核心能力不回归。
# 设计：scripts/eval/run-smoke.ts 跑 1 provider × 5 case，分数下降 > 0.5 则 block merge。
#
# 注意：本 workflow **不** sync baseline_scores（避免 PR CI 污染主分支）；
# 全量回归在另一个 workflow（eval-weekly.yml）由 cron 触发。
#
# 业界对应：Promptfoo / Inspect AI / DeepEval 都建议把 P0 smoke 接进 PR CI。

name: PR Smoke Eval

on:
  pull_request:
    branches: [main]
    paths:
      # P2-2 分包：源码从 src/ 搬到 packages/*/src/。这里必须跟着改 ——
      # 仍写 "src/**" 会永远匹配不到，于是这道 smoke 门禁**静默不再触发**：
      # PR CI 一直显示绿（skipped 也算通过），比没有门禁更危险。
      - "packages/**"
      - "evals/**"
      - "scripts/eval/**"
      - ".github/workflows/eval-pr-smoke.yml"

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 最小权限：读代码 + 往 PR 写一条评论。
    #
    # 不给这个块的后果实测过（2026-08-13 首个真跑的 PR）：GITHUB_TOKEN 默认只读，
    # 末尾 "Comment on PR" 步骤拿 403 `Resource not accessible by integration` 挂掉，
    # 于是 job 有**两个**失败步骤——真正的失败（smoke 本身）被淹在 octokit 的
    # 报错栈里，排查时要先翻掉几十行 x-ratelimit-* 响应头才看得到根因。
    #
    # pull-requests: write 是 createComment 需要的最小权限；刻意不给 write 到别处。
    permissions:
      contents: read
      pull-requests: write

    # 两道前置条件，缺任一则整个 job 不跑（skipped 而非 failure）：
    #
    #  1. 非 fork PR —— fork 默认拿不到 secret。
    #  2. DEEPSEEK_API_KEY 已配置 —— smoke 的 provider 是 sid-code + deepseek-v4-pro。
    #
    # 第 2 条是 2026-08-13 补的，与 eval-weekly / judge-calibration /
    # provider-daily-canary 三个 workflow 同日停用 cron 是同一个原因：开源首发时仓库
    # Actions secrets 一个都没配。**空 secret 不会让 workflow 报「缺少密钥」**，只会让
    # 真实请求死在半路 —— 实测本 workflow 的表现是 sid-code 二进制起不来：
    #     error: 未配置任何模型。请在 ~/.sid-code/settings.json 的 availableModels ...
    # 然后 runner 报「5/5 case 未产出有效分数（skip，疑似评测未真正跑成）」。
    # 症状离根因隔了三层，排查成本远高于直接不跑。
    #
    # 恢复条件：Settings → Secrets and variables → Actions 配好 DEEPSEEK_API_KEY
    # （judge 打分还需 ANTHROPIC_API_KEY）之后，本 job 自动开始跑，无需改这个文件。
    # ⚠️ `secrets` **不是** job 级 `if:` 的合法 context（只有 github / needs / vars /
    # inputs 等可用），写 `secrets.X != ''` 会让整个 workflow 解析失败。所以第 2 条
    # 走「env 提到 job 级 → 各 step 的 if 判 env」这个标准写法，见下方 steps。
    if: github.event.pull_request.head.repo.full_name == github.repository

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      # 缺 key 时不装依赖、不构建、不跑评测，直接给一条明确结论。
      # job 整体仍是 success —— 它本就不该在没有 key 的仓库里报红。
      - name: Check secrets
        id: guard
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PR Smoke Eval 已跳过::未配置 DEEPSEEK_API_KEY，跳过 smoke eval。配好该 secret 后本 job 会自动开始跑，无需改 workflow。"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.has_key == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun
        if: steps.guard.outputs.has_key == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        if: steps.guard.outputs.has_key == 'true'
        run: bun install --frozen-lockfile

      - name: Build sid-code (smoke 需要)
        if: steps.guard.outputs.has_key == 'true'
        # make build 不动版本号，CI 里跑它不会让 package.json 变脏
        run: make build

      - name: Run smoke eval (5 P0 case × sid-code)
        id: smoke
        if: steps.guard.outputs.has_key == 'true'
        run: bun run scripts/eval/run-smoke.ts --provider sid-code --max-regression 0.5

      # 注意条件是 `steps.smoke.outcome != 'skipped'` 而不是 `always()`：
      # 原先写 always() 的话，缺 key 时前面全 skip、根本没 checkout，这一步会因为
      # 找不到 path 而报 warning 甚至失败 —— 又是一条「跳过反而制造噪声」的坑。
      - name: Upload smoke results
        if: steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-results
          path: |
            evals/_runs/sid-code.jsonl
            evals/_reports/smoke-*.md

      - name: Comment on PR
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ PR Smoke Eval 失败：分数下降 > 0.5，请检查 Actions artifact 中的 smoke-eval-results。'
            })
