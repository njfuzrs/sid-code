# Smoke Eval（T-17 §6.4，P0-2 改造：摘出 PR blocking check）
#
# 触发：手动 workflow_dispatch + nightly cron（当前停用，见下方 on: 注释）。
# 设计：scripts/eval/run-smoke.ts 跑 1 provider × 5 case，分数下降 > max-regression 则退出非零。
#
# ⚠️ P0-2（2026-08-13）：本 workflow 曾挂在 `pull_request` 上、当 PR 的 blocking check。
# 已摘掉，理由是机制性的，不是省钱：
#
#   LLM judge 天然有方差（同一份回答重跑 judge 分数会跳变），把它设成必需门禁，
#   红了分不清是真回归还是模型抖动——那会养成"重跑一次看看"的习惯，
#   门禁随即失去意义。确定性判据（bun test / lint / build）才适合当 blocking check，
#   LLM 评测适合当 nightly/手动触发的信号，出问题人工看，不卡 PR 合并。
#
# 参照的三个开源项目实测：codex / opencode 的 PR CI 完全不跑真实 LLM 评测；
# gemini-cli 虽然跑，但窄 paths + environment 人工审批 + concurrency cancel 三重门禁，
# 且用最便宜的模型档位——没有一个项目把 LLM 评测设成无条件的 PR blocking check。
#
# 原本的 paths 过滤（P1-3 指出 `packages/**` 覆盖 1525 个文件、触发面过宽）
# 随本次改动一并解决：workflow_dispatch / schedule 不支持也不需要 paths，
# 不存在"改一行无关代码也触发"的问题了。
#
# 本 workflow **不** sync baseline_scores；全量回归在 eval-weekly.yml。

name: Smoke Eval

on:
  # ⚠️ cron 已停用（同 eval-weekly.yml / provider-daily-canary.yml 的理由）：
  # 依赖 DEEPSEEK_API_KEY，首发时未配置。配好 secret 后取消下方注释即可。
  # schedule:
  #   - cron: "0 2 * * *"  # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:
    inputs:
      max-regression:
        description: "分数下降阈值（默认 0.5）"
        default: "0.5"
        required: false

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 最小权限：只读代码。P0-2 摘掉 pull_request 触发后不再需要 pull-requests: write——
    # 旧版靠 "Comment on PR" 步骤在 PR 上留言，workflow_dispatch/schedule 没有 PR 可评论，
    # 该步骤随本次改动一并删除（见下方 steps）。
    permissions:
      contents: read

    # fork 里不跑 cron：fork 继承 cron 但拿不到 secrets。判据与取舍同 eval-weekly.yml
    # 同位注释（`repository.fork == false` 只拦 schedule，workflow_dispatch 手动触发不受影响）。
    if: ${{ github.event.repository.fork == false || github.event_name != 'schedule' }}

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      # 缺 key 时不装依赖、不构建、不跑评测，直接给一条明确结论。
      # job 整体仍是 success —— 它本就不该在没有 key 的仓库里报红。
      - name: Check secrets
        id: guard
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PR Smoke Eval 已跳过::未配置 DEEPSEEK_API_KEY，跳过 smoke eval。配好该 secret 后本 job 会自动开始跑，无需改 workflow。"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.has_key == 'true'
        uses: actions/checkout@v7

      - name: Setup Bun
        if: steps.guard.outputs.has_key == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        if: steps.guard.outputs.has_key == 'true'
        run: bun install --frozen-lockfile

      - name: Build sid-code (smoke 需要)
        if: steps.guard.outputs.has_key == 'true'
        # make build 不动版本号，CI 里跑它不会让 package.json 变脏
        run: make build

      - name: Run smoke eval (5 P0 case × sid-code)
        id: smoke
        if: steps.guard.outputs.has_key == 'true'
        # 注意：inputs 里带连字符的 key 在表达式语法里必须用中括号取——
        # `github.event.inputs.max-regression` 会被解析成
        # `github.event.inputs.max` 减去变量 `regression`，静默拿到空值而非报错，
        # 排查成本高。已用 `inputs['max-regression']` 写法验证过语法正确。
        run: |
          bun run scripts/eval/run-smoke.ts --provider sid-code \
            --max-regression "${{ github.event.inputs['max-regression'] || '0.5' }}"

      # 注意条件是 `steps.smoke.outcome != 'skipped'` 而不是 `always()`：
      # 原先写 always() 的话，缺 key 时前面全 skip、根本没 checkout，这一步会因为
      # 找不到 path 而报 warning 甚至失败 —— 又是一条「跳过反而制造噪声」的坑。
      - name: Upload smoke results
        if: steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-results
          path: |
            evals/_runs/sid-code.jsonl
            evals/_reports/smoke-*.md
