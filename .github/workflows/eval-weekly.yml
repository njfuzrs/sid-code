# Weekly Full Eval (T-17 §6.4)
#
# 触发：每周一 UTC 16:00（北京时间周二 0:00）；可手动触发。
# 设计：跑全量 25 case × sid-code-deepseek + claude-code，--sync 写回 baseline。
#
# 业界对应：SWE-bench Leaderboard 周更新；Artificial Analysis trend over time。

name: Weekly Full Eval

on:
  # ⚠️ cron 已停用（2026-08-13）：本 workflow 依赖 ANTHROPIC_API_KEY / DEEPSEEK_API_KEY，
  # 而开源首发时仓库 Actions secrets 一个都没配 —— 定时触发只会每周一稳定失败一次，
  # 在 Actions 页面堆红叉。**空 secret 不会让 workflow 报「缺少密钥」，只会让真实请求
  # 拿 401 失败在半路**，排查成本比直接不跑高。
  #
  # 恢复条件：在 Settings → Secrets and variables → Actions 配好上面两个 key 之后，
  # 取消下面 3 行注释即可（不要顺手改 workflow_dispatch，它一直可用）。
  # schedule:
  #   # 每周一 16:00 UTC（北京时间周二 00:00）
  #   - cron: "0 16 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to run (default: sid-code,claude-code)"
        default: "sid-code,claude-code"
        required: false

jobs:
  full-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # fork 里不跑 cron：开源后 fork 会连 cron 一起继承，而 fork 拿不到 secrets ——
    # 结果是每个 fork 每周一收到一封无从修复的失败邮件。
    #
    # 判据选型（三种都见过，这里选第三种）：
    #   · `pull_request.head.repo.full_name == github.repository`（eval-pr-smoke.yml 用的）
    #     —— 本 workflow 无 pull_request 触发，该表达式恒 null，用不了
    #   · `github.repository == 'owner/repo'` —— 要写死 slug。2026-08-12 迁到 GitHub 后
    #     slug 已确定（rushengzhou/sid-code），但仍**不选它**：换 owner 就失效
    #   · `github.event.repository.fork == false` —— 不写死任何名字，换 owner 仍成立
    #
    # 后半段 `|| github.event_name != 'schedule'` 不能省：只拦定时触发，
    # 保留 workflow_dispatch 手动触发（fork 维护者配了自己的 secrets 应该能手动跑）。
    # 另注：`github.event.repository` 在 schedule 事件下曾被报告缺失
    # （community discussion #12269）。缺失时表达式取 null → 判据失效但**fail-open**
    # （上游照跑，不会把自己锁死），代价只是 fork 噪音回归，可接受。
    if: ${{ github.event.repository.fork == false || github.event_name != 'schedule' }}

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      # ─── 前置检查：secret 是否已配（P1-5 第三层）───────────────────────────
      #
      # 这一步的存在理由，就是上面那段"为什么停用 cron"的注释里点破的那个问题：
      # **空 secret 不会让 workflow 报「缺少密钥」，只会让真实请求拿 401 失败在半路**。
      # 那种失败的排查成本高得离谱 —— 日志里是一堆 eval case 的模型调用错误，
      # 得翻到最里层才发现根因是 key 没配。
      #
      # 放在**第一步**（在 checkout 之前也可以，但放这里让 checkout 的报错优先级更清晰）：
      # 让"缺 key"在 5 秒内明确报错，而不是在 20 分钟的 eval 跑到一半时以 401 现形。
      #
      # 这直接消掉了当初注释 cron 的那个理由，为将来恢复定时创造条件 ——
      # 但**本 PR 不恢复 cron**：恢复的前提是 secret 真的配好了，那是一次独立的、
      # 需要人确认的动作，不该由一个改注释的 PR 顺手打开。
      #
      # ⚠ 只检查非空，不校验有效性（那需要真发一次请求，等于把待验证的事提前做了）。
      - name: 前置检查（secret 是否已配）
        run: |
          missing=""
          [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ] && missing="$missing DEEPSEEK_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secret:$missing —— 本 workflow 需要真实模型调用，无法运行。"
            echo "::error::配置位置：Settings → Secrets and variables → Actions。"
            echo "::error::（这一步刻意在第一步就失败：缺 key 若不拦，会在 eval 跑到一半时以 401 现形，排查成本高得多。）"
            exit 1
          fi
          echo "✅ 两个 API key 均已配置（只验非空，不验有效性）"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run full eval (25 case × multi-provider, --sync)
        run: |
          bun run eval:run \
            --provider "${{ github.event.inputs.provider || 'sid-code,claude-code' }}" \
            --concurrency 3 \
            --sync

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-eval-reports
          retention-days: 90
          path: |
            evals/_reports/
            evals/_runs/
