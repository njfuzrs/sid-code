name: ✨ 功能请求
description: 提议一个新功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提议前值得知道本项目的四个长期方向——**贴合其中之一的提议更容易被采纳**：

        - **更快**：降低首字延迟与端到端耗时
        - **更省**：降低单位任务的 token / 成本
        - **更安全**：权限门控、HITL、企业 policy
        - **深度融合企业环境**：团队记忆、企业系统接入

        这几个方向内部有张力（更多权限确认会拖慢速度、动态内容会伤缓存命中率），
        所以「四个指标同时拉满」的提议通常落不了地。说清你愿意牺牲哪一个会更有说服力。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: |
        **先说问题，不要直接说方案。** 描述你实际卡在哪、当前得怎么绕过去。
        问题描述清楚了，方案往往不是你原本想的那个。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 具体一点：新的命令？新的配置项？现有行为怎么变？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他做法
      description: |
        包括「用现有能力绕过去」。sid-code 有 60+ 内置工具、Hook、Skill、MCP、子代理，
        很多需求能靠组合现有能力解决而不必加新功能。
        如果你试过并且不够用，写清哪里不够——这比新功能提议本身更有价值。

  - type: dropdown
    id: direction
    attributes:
      label: 主要对应哪个方向
      options:
        - 更快（延迟 / 耗时）
        - 更省（token / 成本）
        - 更安全（权限 / HITL / policy）
        - 深度融合企业环境
        - 可观测性 / 可度量
        - 开发体验（DX）
        - 都不属于 / 不确定
    validations:
      required: true

  - type: textarea
    id: tradeoff
    attributes:
      label: 它会牺牲什么
      description: |
        新功能都有代价：更多配置项、更多上下文占用、更多确认打扰、更大的维护面。
        你认为这个提议的代价是什么，为什么值得？
        （想不出代价往往意味着还没想透，不是真的没有代价。）

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜过已有 issue，没有重复的
          required: true
        - label: 我查过[官方文档](https://www.sid-code.cc/)，确认现在还没有这个能力
          required: true
