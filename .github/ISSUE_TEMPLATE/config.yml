# 关掉「不用模板直接开空白 issue」的入口：三个模板已覆盖 bug / 功能 / 文档，
# 空白 issue 通常缺版本号与复现步骤，来回追问的成本比填模板高。
blank_issues_enabled: false

contact_links:
  - name: 🔒 安全漏洞（请勿开公开 issue）
    url: https://github.com/rushengzhou/sid-code/blob/master/SECURITY.md
    about: 安全问题请按 SECURITY.md 走 GitHub 私密上报（Security → Report a vulnerability），公开 issue 会在修复前暴露问题。

  - name: 📄 版权 / 归属问题
    url: https://github.com/rushengzhou/sid-code/blob/master/NOTICE
    about: 第三方代码来源与许可见 NOTICE。若发现其中描述与事实不符（低估外部来源比例、漏记来源），请指出，我们会更正。

  - name: 📖 使用文档
    url: https://www.sid-code.cc/
    about: 安装、配置、工具与命令参考。提问前建议先查一下。
