input:
  user_query: |
    我的 CI 挂了，请帮我看一下这个失败日志：

    ```
    FAIL  src/auth/login.test.ts
      ✗ should reject wrong password
        Expected: { error: "wrong_password" }
        Received: { ok: true, userId: "u123" }
        at Object.<anonymous> (src/auth/login.test.ts:42:30)

    Tests:       1 failed, 12 passed
    ```

    （这是上 PR 时 GitHub Actions 跑出来的）
  repo: sid-code
  repo_commit: ""

expected:
