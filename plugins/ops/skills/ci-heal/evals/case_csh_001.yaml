    - "需要更多信息"
    - "请提供更多上下文"
    - "LGTM"
    - "已修复"
  must_call_tools: []
  must_not_call_tools:
    - edit
    - write
  must_modify_files_in: []
  must_not_modify_files:
    - "src/"
  max_steps: 12

  reference_answer: |
    诊断必须给出：
    (1) Failure Class = test_failure
    (2) 引用 src/auth/login.test.ts:42 具体行号
    (3) 至少 1 条 hypothesis（如：login() 函数对 wrong_password 分支返回了 ok:true，需检查密码比对逻辑）
    (4) Verdict = likely_pr_caused（因为是测试失败 + 行号定位明确）

rubric:
  completeness: "识别 test_failure 分类 + 引用 src/auth/login.test.ts:42 行号 + 给出 ≥ 1 条 hypothesis"
  precision: "不能 false positive 把 test_failure 归为 flaky 或 build_failure"
  helpfulness: "至少 1 条 Suggested Fix 含可执行步骤（如检查 login.ts 密码分支）"

